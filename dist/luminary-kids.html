<title>Luminary Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Luminary Kids — Amharic-first hands-on math lessons for Grades 1–2.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>/* Layout: one narrow play column (max 720px) for children; wider bands (max 1040px) for the grown-up landing page.
   Palette from the Ethiopian highlands: mist ground, indigo ink, Adey Abeba marigold, lake teal, field green, coffee-berry. */
:root {
  --bg: #f2f6f3;
  --surface: #ffffff;
  --tray: #e9f0ea;
  --ink: #1d2540;
  --muted: #586178;
  --line: #d3dcdb;
  --adey: #f2b705;
  --adey-soft: #fff1c2;
  --adey-ink: #5a4300;
  --lake: #1f7a8c;
  --lake-soft: #d9eef2;
  --field: #2f8f5b;
  --field-soft: #dcf1e4;
  --berry: #b8456e;
  --berry-soft: #f8e1ea;
  --shadow: 0 1px 0 rgba(29, 37, 64, .06), 0 8px 24px -12px rgba(29, 37, 64, .25);
  --f-body: 'Andika', 'Noto Sans Ethiopic', 'Nyala', system-ui, sans-serif;
  --f-display: 'Baloo 2', 'Noto Sans Ethiopic', 'Nyala', system-ui, sans-serif;
  --f-eth: 'Noto Sans Ethiopic', 'Abyssinica SIL', 'Nyala', sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11182a; --surface: #1a2338; --tray: #222c45; --ink: #eef1f7; --muted: #a6afc4; --line: #2f3a56;
    --adey: #f5c33b; --adey-soft: #3d3313; --adey-ink: #ffe6a0; --lake: #56b6c9; --lake-soft: #173a44;
    --field: #5cc48a; --field-soft: #183a29; --berry: #e483a8; --berry-soft: #43222f;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11182a; --surface: #1a2338; --tray: #222c45; --ink: #eef1f7; --muted: #a6afc4; --line: #2f3a56;
  --adey: #f5c33b; --adey-soft: #3d3313; --adey-ink: #ffe6a0; --lake: #56b6c9; --lake-soft: #173a44;
  --field: #5cc48a; --field-soft: #183a29; --berry: #e483a8; --berry-soft: #43222f;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .7); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
:lang(am), .am { font-family: var(--f-eth); line-height: 1.7; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lake); outline-offset: 3px; border-radius: 8px; }
.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.play { max-width: 720px; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--lake); }
.muted { color: var(--muted); }
.en-sub { display: block; font-family: var(--f-body); font-size: .82em; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1; }
.brand small { font-family: var(--f-eth); color: var(--muted); font-size: .8rem; display: block; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.linkbtn { background: none; border: 0; color: var(--lake); font-weight: 700; cursor: pointer; padding: 8px 4px; min-height: 44px; }
.stars { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; background: var(--adey-soft); color: var(--adey-ink); border-radius: 999px; padding: 4px 12px; }
.stars svg { width: 18px; height: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 22px; min-height: 52px; font-weight: 700; font-size: 1.05rem; cursor: pointer; background: var(--ink); color: var(--bg); transition: transform .12s; }
.btn:active { transform: translateY(1px); }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.adey { background: var(--adey); color: #2a2000; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: .95rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon { width: 20px; height: 20px; flex: none; }

/* landing */
.hero { padding-block: 40px 28px; }
.hero .wrap { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; }
.hero h1 .am { display: block; font-size: .62em; color: var(--lake); margin-bottom: 6px; font-weight: 700; }
.hero p.lead { font-size: 1.15rem; margin-top: 14px; max-width: 34em; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.hero-art { position: relative; border-radius: 28px; overflow: hidden; background: var(--tray); }
.hero-art .scene { display: block; width: 100%; height: auto; }
.hero-art .wali { position: absolute; width: 46%; right: 4%; bottom: 0; }
.hero-art .bubble { position: absolute; left: 5%; top: 8%; max-width: 54%; }
.bubble { background: var(--surface); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); font-size: .98rem; }
.band { padding-block: 36px; }
.band.tint { background: var(--surface); border-block: 1px solid var(--line); }
.band h2 { margin-bottom: 8px; }
.band .intro { max-width: 40em; margin-bottom: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.point { display: grid; gap: 6px; }
.point .dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-family: var(--f-display); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { background: var(--bg); border-radius: var(--r); padding: 16px; counter-increment: s; }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--adey); color: #2a2000; font-weight: 800; margin-bottom: 8px; }
.lessons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; text-align: left; padding: 0; cursor: pointer; }
.lcard .scene { width: 100%; height: auto; display: block; }
.lcard .body { padding: 12px 14px 14px; display: grid; gap: 2px; }
.lcard .num { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.report-demo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.offer { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; align-items: start; }
.price { background: var(--surface); border: 2px solid var(--adey); border-radius: 22px; padding: 22px; display: grid; gap: 12px; }
.price .amt { font-family: var(--f-display); font-size: 2.6rem; font-weight: 800; line-height: 1; }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--adey-soft); color: var(--adey-ink); }
.tag.lake { background: var(--lake-soft); color: var(--lake); }
.tag.field { background: var(--field-soft); color: var(--field); }
.tag.berry { background: var(--berry-soft); color: var(--berry); }
.tag.plain { background: var(--tray); color: var(--muted); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.checks li::before { content: ""; width: 18px; height: 18px; margin-top: 4px; border-radius: 50%; background: var(--field-soft); box-shadow: inset 0 0 0 5px var(--field); }
.terms { font-size: .92rem; color: var(--muted); display: grid; gap: 6px; }
.panel { background: var(--lake-soft); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyrow code { background: var(--surface); padding: 6px 10px; border-radius: 8px; user-select: all; overflow-wrap: anywhere; }
details.faq { border-top: 1px solid var(--line); padding-block: 12px; }
details.faq summary { cursor: pointer; font-weight: 700; min-height: 32px; }
details.faq p { margin-top: 8px; max-width: 46em; }
footer { padding-block: 28px 40px; color: var(--muted); font-size: .9rem; }

/* child home */
.home { padding-block: 18px 40px; display: grid; gap: 18px; }
.greet { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: end; }
.greet .wali { width: 130px; height: auto; }
.next-card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.next-card .scene { width: 100%; height: 100%; object-fit: cover; display: block; }
.next-card .body { padding: 18px; display: grid; gap: 10px; align-content: center; }
.path { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.stone { width: 100%; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px 8px 8px; cursor: pointer; text-align: left; min-height: 72px; }
.stone .badge { width: 56px; height: 56px; }
.stone[data-locked="1"] { opacity: .75; }
.lv { display: inline-flex; gap: 4px; }
.lv i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.lv i.on { background: var(--field); }
.garden { background: var(--field-soft); border-radius: 22px; padding: 14px; }
.garden .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.garden .badge { width: 54px; height: 54px; }

/* lesson player */
.player { padding-block: 14px 40px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 12px; background: var(--tray); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--field); border-radius: 999px; transition: width .3s; }
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.prompt-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.prompt { font-size: clamp(1.25rem, 4.6vw, 1.6rem); font-weight: 700; }
.listen { width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--lake-soft); color: var(--lake); cursor: pointer; display: grid; place-items: center; }
.listen .icon { width: 26px; height: 26px; }
.visual { display: grid; place-items: center; background: var(--tray); border-radius: 18px; padding: 12px; overflow-x: auto; }
.visual svg { width: 100%; max-width: 420px; height: auto; display: block; }
.visual svg.line { max-width: 640px; }
.visual svg.scene { max-width: 100%; border-radius: 12px; }
.visual-wrap { overflow-x: auto; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { min-height: 72px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 2rem; font-weight: 800; cursor: pointer; }
.opt.word { font-family: var(--f-eth); font-size: 1.3rem; }
.opt:hover { border-color: var(--lake); }
.opt.right { background: var(--field-soft); border-color: var(--field); color: var(--field); }
.opt.wrong { background: var(--berry-soft); border-color: var(--berry); color: var(--berry); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .grow { flex: 1; }
.feedback { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; border-radius: 18px; padding: 10px 14px; }
.feedback .wali { width: 76px; height: auto; }
.feedback.ok { background: var(--field-soft); }
.feedback.retry { background: var(--adey-soft); }
.feedback.show { background: var(--lake-soft); }
.hintbox { background: var(--adey-soft); color: var(--adey-ink); border-radius: 14px; padding: 10px 14px; }
.story { display: grid; gap: 12px; }
.story .stage { position: relative; }
.story .stage .scene { width: 100%; height: auto; border-radius: 18px; display: block; }
.story .stage .wali { position: absolute; width: 34%; right: 2%; bottom: -4px; }
.counted { font-weight: 700; color: var(--lake); }
.done { text-align: center; justify-items: center; }
.done .wali { width: 180px; }
.done .badge { width: 120px; }
.kids { display: flex; gap: 10px; flex-wrap: wrap; }
.kidbtn { border: 3px solid transparent; border-radius: 50%; padding: 0; background: none; cursor: pointer; width: 76px; height: 76px; }
.kidbtn[aria-pressed="true"] { border-color: var(--adey); }
.kidbtn svg { width: 100%; height: 100%; }

/* svg math visuals — theme aware */
.mv .mv-frame { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.mv .mv-cell { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.mv .mv-counter { fill: var(--lake); }
.mv .mv-counter.cb, .mv .cb .mv-counter { fill: var(--berry); }
.mv .mv-tray { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.mv .mv-tray.dashed { stroke-dasharray: 8 6; stroke: var(--muted); }
.mv .mv-line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.mv .mv-num { fill: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.mv .mv-num.small { font-size: 15px; }
.mv text.mv-num[text-anchor] { font-size: 40px; }
.mv .tick text.mv-num { font-size: 30px; }
.mv .tick text.mv-num.small { font-size: 15px; }
.mv .mv-mark { fill: var(--adey); stroke: var(--ink); stroke-width: 2; }
.mv .mv-start { fill: var(--lake); stroke: var(--surface); stroke-width: 3; }
.mv .mv-hop { fill: none; stroke: var(--berry); stroke-width: 3; }
.mv .mv-arrowhead { fill: var(--berry); }
.mv .mv-cross { stroke: var(--berry); stroke-width: 5; stroke-linecap: round; }
.mv .hit { fill: transparent; }
.mv .tap { cursor: pointer; }
.mv .tick.sel .mv-num { fill: var(--lake); }
.mv .tick.sel line { stroke: var(--lake); }
.mv .tick.right .mv-num { fill: var(--field); }
.mv .side.sel .mv-tray { stroke: var(--lake); stroke-width: 4; }
.mv .obj.tapped { opacity: .55; }
.mv .tapnum { fill: var(--bg); font: 700 15px var(--f-display); }
.mv .tapdot { fill: var(--ink); }
.mv .cell.tap:hover .mv-cell { fill: var(--lake-soft); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); z-index: 20; font-size: .95rem; }

/* grown-ups */
.parents { padding-block: 20px 48px; display: grid; gap: 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.tile b { display: block; font-family: var(--f-display); font-size: 1.8rem; line-height: 1.1; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.formrow { display: grid; gap: 6px; }
input[type="text"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100%; }
textarea { min-height: 90px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.toggle input { width: 22px; height: 22px; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.confirm { background: var(--berry-soft); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }

@media (max-width: 760px) {
  .hero .wrap, .offer { grid-template-columns: 1fr; }
  .grid3, .lessons { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .next-card { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .greet { grid-template-columns: 96px 1fr; }
  .greet .wali { width: 96px; }
  .brand small { display: none; }
}
@media (max-width: 420px) {
  .top .linkbtn { font-size: .9rem; }
  .seg button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.reduce * { transition: none !important; animation: none !important; }
@keyframes pop { 0% { transform: scale(.85); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
.pop { animation: pop .35s ease-out; }

.kidbtn:has(input:checked) { border-color: var(--adey); }
.kidbtn:focus-within { outline: 3px solid var(--lake); outline-offset: 2px; }
.mv .mv-frame { pointer-events: none; }
.mv .cell.tap .mv-cell { fill: transparent; }
.mv .cell.tap .mv-cell:hover { fill: var(--lake-soft); }

.brand > span { min-width: 0; }
@media (max-width: 480px) { .hide-sm { display: none; } .brand b { font-size: 1rem; } }
.mv .mv-marknum { fill: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 44px; }

/* legal pages */
.legal { padding-block: 20px 48px; display: grid; gap: 16px; max-width: 760px; }
.legal h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
.legal-sec { display: grid; gap: 6px; }
.legal-sec h2 { font-size: 1.15rem; }
.legal-sec p { max-width: 65ch; }
.legal mark { background: var(--adey-soft); color: var(--adey-ink); border-radius: 4px; padding: 0 3px; }
.draft-note { background: var(--berry-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; }
.footer-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.footer-row > span { flex: 1 1 320px; min-width: 0; }
.footer-links { display: flex; gap: 12px; }
.linkbtn.inline { min-height: 0; padding: 0; text-decoration: underline; font-weight: 600; }
.copyable { user-select: all; }


/* Playful UI refresh: motion enhances learning but never hides math content. */
:root {
  --play-ring: 0 0 0 4px color-mix(in srgb, var(--lake) 22%, transparent);
  --play-lift: 0 14px 28px -17px rgba(29,37,64,.36);
}
.hero {
  background: radial-gradient(circle at 85% 15%, var(--adey-soft), transparent 38%),
              radial-gradient(circle at 5% 95%, var(--lake-soft), transparent 36%),
              var(--bg);
}
.hero-art .wali { transform-origin: 50% 90%; animation: wali-welcome 3.2s ease-in-out infinite; }
.hero-art .bubble { animation: bubble-arrive .6s ease-out both; }
.lcard, .opt, .kidbtn, .btn { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background-color .18s ease; }
.lcard:hover, .lcard:focus-visible { transform: translateY(-4px); box-shadow: var(--play-lift); }
.btn:hover, .opt:hover { transform: translateY(-2px); box-shadow: var(--play-lift); }
.btn:active, .opt:active, .lcard:active, .kidbtn:active { transform: scale(.97); }
.opt { min-height: 80px; border-width: 3px; box-shadow: 0 4px 0 var(--line); touch-action: manipulation; }
.opt:focus-visible, .lcard:focus-visible, .btn:focus-visible, .kidbtn:focus-visible,
.mv .tap:focus-visible { outline: 4px solid var(--lake); outline-offset: 3px; }
.opt.right { animation: answer-celebrate .48s ease-out both; }
.opt.wrong { animation: answer-try-again .36s ease-out both; }
.feedback.ok .wali, .done .wali { transform-origin: 50% 90%; animation: wali-cheer .7s ease-out both; }
.done .badge { animation: badge-bloom .65s cubic-bezier(.2,1.5,.4,1) both; }

@keyframes wali-welcome { 0%,100% { transform: rotate(-2deg) translateY(0); } 50% { transform: rotate(2deg) translateY(-7px); } }
@keyframes bubble-arrive { from { opacity:0; transform: translateY(14px) scale(.95); } to { opacity:1; transform: translateY(0) scale(1); } }
@keyframes answer-celebrate { 0% { transform: scale(.94); } 60% { transform: scale(1.07); } 100% { transform: scale(1); } }

@keyframes wali-cheer { 0% { transform: scale(.92) rotate(-4deg); } 55% { transform: scale(1.08) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes badge-bloom { from { transform:scale(.6) rotate(-10deg); opacity:.5; } to { transform:scale(1) rotate(0); opacity:1; } }

@media (prefers-reduced-motion:reduce) {
  .hero-art .wali, .hero-art .bubble, .opt.right, .opt.wrong,

}

.reduce .feedback.ok .wali, .reduce .done .wali, .reduce .done .badge { animation:none !important; }

/* Five-question arcade on the learner home */

.mini-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }

.mini-objects { font-size:clamp(1.8rem,7vw,3rem); }

@media(max-width:550px) { .mini-grid { grid-template-columns:1fr; } .mini-tile { min-height:88px; flex-direction:row; text-align:left; } .mini-tile span { font-size:2rem; } .mini-options { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(prefers-reduced-motion:reduce) { .mini-track span,.mini-tile { transition:none; } }
.reduce .mini-track span,.reduce .mini-tile { transition:none; }

/* Phase 3: a three-stop illustrated adventure journey */
.adventure-map {display:flex; align-items:center; gap:8px; padding:16px; border-radius:24px; background:linear-gradient(145deg,var(--field-soft),var(--lake-soft) 53%,var(--adey-soft));}
.adventure-stop {flex:1; min-width:0; display:grid; gap:8px; justify-items:center; position:relative;}

.adventure-step {display:grid; place-items:center; width:30px; height:30px; border-radius:50%; font-weight:800; color:var(--surface); background:var(--lake);}

.adventure-map .mini-tile {width:100%; min-height:128px; z-index:1;}

.adventure-trail {color:var(--lake); font-size:2rem; font-weight:800; align-self:center;}
.mini-finish .wali {animation:wali-cheer 1.1s ease-in-out infinite alternate;}
@keyframes scene-bob {0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-7px) rotate(2deg)}}
@media(max-width:650px) {.adventure-map{flex-direction:column}.adventure-stop{width:100%}.adventure-map .mini-tile{min-height:82px}.adventure-trail{transform:rotate(90deg);line-height:1}}
@media(prefers-reduced-motion:reduce) {.adventure-scene,.mini-finish .wali{animation:none!important}}
.reduce .adventure-scene,.reduce .mini-finish .wali{animation:none!important}

/* ===== Hands-on lessons: player, exercises, games, map, wardrobe. Touch first: every piece is 64px+. ===== */
[hidden] { display: none !important; }
body { overflow-x: clip; }
.adv-lesson { padding-bottom: 40px; }
.adv-bar { display: flex; align-items: center; gap: 10px; padding: 12px 0; position: sticky; top: 58px; z-index: 4; background: var(--bg); }

/* intro + celebration */

.btn.big { min-height: 64px; font-size: 1.25rem; padding: 0 34px; border-radius: 32px; }
.celebrate h1 { font-size: clamp(1.6rem, 6vw, 2.3rem); position: relative; z-index: 1; line-height: 1.4; }

.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.big-stars { font-size: 72px; line-height: 1; margin: 16px 0; color: var(--line); }
.big-stars span { display: inline-block; transform: scale(.4); opacity: .4; }

.actions.center { justify-content: center; }

/* ===== video ===== */

.adv-video video { width: 100%; height: 100%; display: block; }
.vplay { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--adey); color: var(--ink); font-size: 2rem; box-shadow: var(--shadow); cursor: pointer; }
.cp-layer { margin-top: 12px; }

.sheet { position: fixed; inset: 0; z-index: 80; background: rgba(17, 24, 42, .55); display: grid; place-items: center; padding: 16px; }
.sheet-in { background: var(--surface); border-radius: var(--r); padding: 16px; width: min(640px, 100%); display: grid; gap: 12px; box-shadow: var(--shadow); }

/* ===== exercise shell ===== */
.ex { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.ex-prompt { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }

.ex.is-right { outline: 4px solid var(--field); }

.vis { max-width: 100%; height: auto; }

.vis.groups { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.grp { display: inline-flex; flex-wrap: wrap; max-width: 140px; gap: 2px; padding: 6px; border: 2px dashed var(--lake); border-radius: 14px; background: var(--lake-soft); }

.spark { position: fixed; width: 10px; height: 10px; border-radius: 3px; pointer-events: none; z-index: 90; animation: spark .75s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(200deg); opacity: 0; } }
.pop { animation: popin .35s cubic-bezier(.3, 1.7, .5, 1); }
@keyframes popin { from { transform: scale(.6); } to { transform: scale(1); } }
.pulse { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 0 8px color-mix(in srgb, var(--field) 30%, transparent); } }
.shake { animation: wobble .35s; }
html.reduce .pop, html.reduce .pulse, html.reduce .ex.wobble, html.reduce .shake { animation: none; }

/* ===== drag pieces & drop zones ===== */
.drag { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; -webkit-tap-highlight-color: transparent; }
.drag.ghost { cursor: grabbing; pointer-events: none; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25)); }

.drag:focus-visible { outline: 3px solid var(--lake); }

.ph { display: inline-block; }
.zone.over { outline: 4px dashed var(--adey); outline-offset: 4px; background-color: var(--adey-soft); }
.zone-home { min-height: 72px; }

.piece { display: inline-grid; place-items: center; min-width: 64px; min-height: 64px; border-radius: 14px; }

.dd-count { position: absolute; right: 10px; bottom: 6px; font: 800 1.4rem var(--f-display); color: var(--ink); background: var(--surface); border-radius: 12px; padding: 0 10px; min-width: 40px; text-align: center; }
.dd-ref .dd-count { position: static; }
.dd-target.basket { background: #e9c99a; border: 4px solid #b58b52; border-radius: 18px 18px 60px 60px; }

.dd-target.bajaj .dd-in { background: #d9eef2; border-radius: 18px; min-height: 76px; padding: 4px; }
.dd-target.bajaj .wheel { position: absolute; bottom: -18px; width: 38px; height: 38px; border-radius: 50%; background: #1d2540; border: 5px solid #586178; }
.dd-target.bajaj .wheel.l { left: 34px; } .dd-target.bajaj .wheel.r { right: 34px; }
.dd-target.bajaj .dd-count { bottom: 8px; }
.dd-target.tray { background: #e7c79b; border: 4px solid #a8763c; border-radius: 50%; min-height: 110px; padding-top: 18px; }
.dd-target.tray.static { min-width: 180px; }
.dd-target.tree { background: radial-gradient(circle at 50% 40%, #6fbf73 0 58%, transparent 59%), linear-gradient(#7a4a22, #7a4a22) center bottom / 26px 40% no-repeat; min-height: 240px; min-width: 280px; padding: 28px 30px 90px; }
.dd-target.tenframe .dd-in { display: grid; grid-template-columns: repeat(5, 62px); gap: 0; border: 3px solid var(--ink); border-radius: 8px; background: #fff; }
.dd-target.tenframe .cell { width: 62px; height: 62px; border: 1.5px solid var(--ink); display: grid; place-items: center; }
.dd-supply { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; padding: 10px; border-radius: 18px; background: var(--tray); width: 100%; max-width: 420px; }
.dd-wrap.remove { grid-template-columns: 1fr; }

.eqn { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font: 800 clamp(2rem, 9vw, 3rem)/1 var(--f-display); }
.eqn .op { color: var(--lake); }
.blank { display: inline-grid; place-items: center; min-width: 84px; min-height: 84px; border: 4px dashed var(--lake); border-radius: 18px; background: var(--lake-soft); }
.blank.filled { border-style: solid; border-color: var(--field); background: var(--field-soft); }
.tiles { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.tile { display: inline-grid; place-items: center; min-width: 76px; min-height: 76px; padding: 0 10px; border-radius: 18px; background: var(--adey); color: var(--ink); font: 800 2rem var(--f-display); box-shadow: 0 4px 0 #c28f00; }

.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; width: 100%; }
.bin { min-height: 150px; border-radius: 18px; border: 3px solid var(--line); background: var(--tray); padding: 10px; display: grid; align-content: start; gap: 8px; text-align: center; }

.card { display: inline-grid; place-items: center; gap: 2px; min-width: 76px; min-height: 76px; padding: 6px 10px; border-radius: 16px; background: var(--surface); border: 3px solid var(--lake); font: 800 1.35rem var(--f-display); box-shadow: 0 3px 0 var(--line); }

.nl { position: relative; width: min(100%, 560px); height: 130px; margin: 6px 24px 0; }
.nl-line { position: absolute; left: 0; right: 0; top: 70px; height: 5px; background: var(--ink); border-radius: 3px; }
.tick { position: absolute; top: 58px; width: 0; }
.tick i { position: absolute; left: -2px; width: 4px; height: 28px; background: var(--ink); border-radius: 2px; }
.tick em { position: absolute; top: 34px; left: -24px; width: 48px; text-align: center; font: 700 1rem var(--f-body); font-style: normal; color: var(--muted); }
.tick .slot { position: absolute; bottom: 22px; left: -22px; width: 44px; height: 64px; border-radius: 12px; }
.tick .slot:empty { background: transparent; }
.tick .slot.over { background: var(--adey-soft); }
.tick .slot .tile { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); min-width: 48px; min-height: 48px; font-size: 1.15rem; }
.tick .slot .tile.ghost { transform: none; }

.pv { width: 100%; display: grid; gap: 12px; }
.pv-src { display: flex; gap: 20px; justify-content: center; align-items: center; padding: 10px; background: var(--tray); border-radius: 18px; }
.src-rod, .src-cube { display: inline-grid; place-items: center; min-width: 72px; min-height: 72px; background: var(--surface); border-radius: 14px; border: 3px solid var(--line); }
.pv-mat { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pv-col { position: relative; min-height: 170px; border-radius: 18px; padding: 8px 8px 34px; text-align: center; }
.pv-col.tens { background: var(--lake-soft); }

.pv-in { display: flex; flex-wrap: wrap; gap: 4px; justify-content: center; align-content: flex-start; min-height: 120px; }

.pv-n { position: absolute; bottom: 6px; left: 0; right: 0; font: 800 1.4rem var(--f-display); }

.piece.rod, .piece.cube { min-width: 0; min-height: 0; }

.match-slots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }

.m-in { min-height: 64px; }

.shop { display: grid; grid-template-columns: auto 1fr; gap: 12px; width: 100%; align-items: center; }
.shop-item { display: grid; justify-items: center; background: var(--adey-soft); border-radius: 18px; padding: 10px 14px; }
.shop-item .pic { font-size: 52px; }
.price { font: 800 1.4rem var(--f-display); }
.counter { position: relative; min-height: 130px; border-radius: 18px; border: 3px dashed var(--field); background: var(--field-soft); padding: 10px 10px 34px; }
.counter .lbl { display: block; text-align: center; color: var(--muted); }
.c-in { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.paid { position: absolute; bottom: 6px; left: 0; right: 0; text-align: center; font: 800 1.2rem var(--f-display); }
.wallet { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; padding: 10px; background: var(--tray); border-radius: 18px; width: 100%; }
.cash { display: inline-grid; place-items: center; min-width: 64px; min-height: 64px; }

.frac { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; }
.inj { position: relative; width: 200px; height: 200px; border-radius: 50%; }

.pieces { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; max-width: 260px; padding: 10px; border-radius: 18px; background: var(--tray); }
.fpiece { display: inline-grid; place-items: center; min-width: 64px; min-height: 64px; }
.frac-count { font: 800 1.3rem var(--f-display); }

/* ===== tap / pad / swipe / clock / trace ===== */
.opts { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.opt { min-width: 84px; min-height: 76px; padding: 8px 14px; border-radius: 18px; border: 3px solid var(--line); background: var(--surface); font: 800 1.6rem var(--f-display); color: var(--ink); cursor: pointer; display: grid; place-items: center; gap: 4px; }

.opt.nope { opacity: .45; border-style: dashed; }
.opts.dim { opacity: .35; pointer-events: none; }
.big-listen { width: 96px; height: 96px; border-radius: 50%; border: 0; background: var(--lake); color: #fff; font-size: 2.4rem; cursor: pointer; box-shadow: var(--shadow); }

  ACT.visual = visual;

  // ---------------- drag engine ----------------

  let selected = null; // tap-to-select fallback

    el.classList.add('drag');

    const end = (e) => {
      if (!st) return;

      const restore = () => {
        const g = s.ghost;

      const isWordy = false;
      answer = `<div class="opts ${it.options.length === 2 ? 'two' : ''}">${it.options.map((o) => {
        const cls = R.state !== 'ask' && o === it.answer && (R.state === 'right' || R.state === 'shown') ? 'right' : R.picked === o && R.state !== 'right' ? 'wrong' : '';
        return `<button class="opt tnum ${isWordy ? 'word' : ''} ${cls}" data-act="answer" data-v="${o}" ${R.state === 'right' || R.state === 'shown' ? 'disabled' : ''}>${o}</button>`;
      }).join('')}</div>`;
    } else if (it.input === 'pick') {
      answer = `<div class="opts two">${['left', 'right'].map((s) => {
        const cls = (R.state === 'right' || R.state === 'shown') && s === it.answer ? 'right' : R.picked === s && R.state !== 'right' ? 'wrong' : '';
        return `<button class="opt word ${cls}" data-act="answer" data-v="${s}" ${R.state === 'right' || R.state === 'shown' ? 'disabled' : ''}>${s === 'left' ? '← ' : ''}${esc(U()[s])}${s === 'right' ? ' →' : ''}</button>`;
      }).join('')}</div>`;
    } else if (it.input === 'line') {
      answer = `<p class="muted">${bi({ am: LK.ui.am.tapLine, en: LK.ui.en.tapLine })}</p>`;
    } else if (it.input === 'build') {
      answer = `<div class="actions"><span class="counted tnum" aria-live="polite">${R.built.size} / 10</span><span class="grow"></span><button class="btn" data-act="buildcheck" ${R.state === 'right' || R.state === 'shown' ? 'disabled' : ''}>${uiBi('check')}</button></div>`;
    }
    if (it.type === 'count' && R.state === 'ask') answer = `<p class="muted">${bi({ am: LK.ui.am.tapToCount, en: LK.ui.en.tapToCount })} <span class="counted tnum" aria-live="polite">${R.tapped.length ? R.tapped.length : ''}</span></p>` + answer;

    const hint = R.hintOn ? `<div class="hintbox">${bi({ am: textFor(it, 'hint').am, en: textFor(it, 'hint').en })}</div>` : '';
    let fb = '';
    if (R.msg) {
      const pose = R.state === 'right' ? 'celebrate' : R.state === 'shown' ? 'explain' : 'encourage';
      fb = `<div class="feedback ${R.state === 'right' ? 'ok' : R.state === 'shown' ? 'show' : 'retry'} pop" role="status">${A.wali(pose, 'Wali')}<div>${bi(R.msg)}</div></div>`;
    }
    const done = R.state === 'right' || R.state === 'shown';
    return `<div class="card">
      <div class="prompt-row"><h2 class="prompt" tabindex="-1">${bi({ am: txt.am, en: txt.en })}</h2><button class="listen" data-act="speak" aria-label="${esc(U().listen)}">${ICON.speaker}</button></div>
      <div class="visual" data-input="${it.input}" data-type="${it.type}">${vis}</div>
      ${hint}${answer}${fb}
      <div class="actions">${!done && it.input !== 'build' && !R.hintOn ? `<button class="btn alt small" data-act="hint">${ICON.bulb}${uiBi('hint')}</button>` : ''}${!done && it.input === 'build' && !R.hintOn ? `<button class="btn alt small" data-act="hint">${ICON.bulb}${uiBi('hint')}</button>` : ''}<span class="grow"></span>${done ? `<button class="btn adey" data-act="next">${uiBi('next')}</button>` : ''}</div>
    </div>`;
  }

  function runView() {
    const R = S.run, step = R.steps[R.i], L = learner();
    const lesson = R.skill ? LK.lessons.find((l) => l.id === R.skill) : null;
    const pct = Math.round((R.i / (R.steps.length - 1)) * 100);
    let body = '';
    if (step.k === 'intro') {
      body = `<div class="card story"><div class="stage">${A.scene('meadow', 'A meadow of yellow Adey Abeba flowers')}${A.wali('welcome', 'Wali waving')}</div>
        <div class="prompt-row"><h2 class="prompt" tabindex="-1">${uiBi('diagnosticIntro')}</h2><button class="listen" data-act="speak" aria-label="${esc(U().listen)}">${ICON.speaker}</button></div>
        <div class="actions"><span class="grow"></span><button class="btn adey" data-act="next">${uiBi('start')}</button></div></div>`;
    } else if (step.k === 'story') {
      body = `<div class="card story"><span class="eyebrow">${bi({ am: `ትምህርት ${lesson.n}`, en: `Lesson ${lesson.n}` })}</span><h2 tabindex="-1">${bi(lesson.title)}</h2>
        <div class="stage">${A.scene(lesson.scene, lesson.title.en)}${A.wali('welcome', 'Wali waving')}</div>
        <div class="prompt-row"><p class="prompt" style="font-weight:400">${bi(lesson.story)}</p><button class="listen" data-act="speak" aria-label="${esc(U().listen)}">${ICON.speaker}</button></div>
        <div class="actions"><span class="grow"></span><button class="btn adey" data-act="next">${uiBi('next')}</button></div></div>`;
    } else if (step.k === 'example') {
      body = `<div class="card"><span class="eyebrow">${uiBi('example')}</span>
        <div class="feedback show">${A.wali('explain', 'Wali explaining')}<div class="prompt" style="font-weight:400;font-size:1.15rem">${bi(lesson.example)}</div></div>
        <div class="visual">${exampleVisual(lesson.id)}</div>
        <div class="actions"><button class="listen" data-act="speak" aria-label="${esc(U().listen)}">${ICON.speaker}</button><span class="grow"></span><button class="btn adey" data-act="next">${uiBi('practice')}</button></div></div>`;
    } else if (step.k === 'item') {
      const tag = step.src === 'game' ? uiBi('game') : step.src === 'review' ? uiBi('review') : step.src === 'diag' ? uiBi('diagnostic') : uiBi('practice');
      body = `<span class="eyebrow">${tag}</span>` + itemView();
    } else if (step.k === 'done') {
      body = doneView();
    }
    return `<main class="wrap play player">
      <div class="bar"><button class="btn alt small" data-act="home" aria-label="${esc(U().home)}">${ICON.back}</button><div class="progress" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${pct}"><i style="width:${pct}%"></i></div><span class="stars tnum">${ICON.star}${L.stars}</span></div>
      ${body}</main>`;
  }
  function exampleVisual(id) {
    switch (id) {
      case 'count10': return A.group({ thing: 'flower', n: 6, layout: 'rows' }, '6 flowers');
      case 'teens': return A.tenframes({ filled: 14, thing: 'orange' }, 'One full ten frame and four more oranges: 14');
      case 'compare': return A.compare({ thing: 'cup', left: 6, right: 4 }, 'Left tray 6 cups, right tray 4 cups', [U().left, U().right]);
      case 'add10': return A.join({ thing: 'child', a: 3, b: 2 }, '3 children and 2 more');
      case 'sub10': return A.takeaway({ thing: 'mango', a: 7, b: 3 }, '7 mangoes with 3 crossed out');
      case 'make10': return A.maketen({ a: 8, b: 5 }, '8 and 5: move 2 to make ten', true);
    }
    return '';
  }
  function doneView() {
    const R = S.run, L = learner();
    const earned = L.stars - R.stars0;
    if (R.kind === 'diag') {
      return `<div class="card done">${A.wali('celebrate', 'Wali celebrating')}<h2>${bi({ am: 'በጣም ጥሩ! ከየት እንደምንጀምር አሁን አውቀናል።', en: 'Great! Now we know where to start.' })}</h2>
        <button class="btn adey" data-act="home">${uiBi('next')}</button></div>`;
    }
    const lesson = LK.lessons.find((l) => l.id === R.skill);
    const badge = R.events.includes('badge');
    return `<div class="card done">${badge ? A.badge(lesson.n, true, LK.badges[lesson.id].en) : A.wali('celebrate', 'Wali celebrating')}
      <h2>${badge ? uiBi('badgeEarned') : uiBi('lessonDone')}</h2>
      ${badge ? `<p>${bi(LK.badges[lesson.id])}</p>` : `<p>${uiBi('keepGoing')}</p>`}
      <p class="stars tnum" style="justify-self:center">${ICON.star}+${earned}</p>
      <div class="actions" style="justify-content:center"><button class="btn alt" data-act="lesson" data-skill="${R.skill}">${bi({ am: 'እንደገና', en: 'Play again' })}</button><button class="btn adey" data-act="home">${uiBi('home')}</button></div>
      ${R.guest ? `<p class="muted">${bi({ am: 'ይህ ናሙና ነው። ለልጅዎ መገለጫ በማዘጋጀት እድገትን ያስቀምጡ።', en: 'This was a sample. Set up a profile for your child on the grown-ups page to save progress.' })}</p>` : ''}
    </div>`;
  }

  // ---------- answering ----------
  function finishItem(correct) {
    const R = S.run, it = R.item, step = R.steps[R.i];
    const result = { correct, tries: R.tries, hints: R.hints };
    const L = learner();
    if (step.src === 'diag') { R.diag.push({ item: it, result }); if (correct) L.stars += 1; }
    else if (step.src === 'game') { if (correct) L.stars += 1; }
    else {
      const out = LK.record(L, it, result, Date.now(), step.src === 'review' ? 'review' : 'practice');
      R.events.push(...out.events);
      if (out.events.includes('show-example') && R.kind === 'lesson') R.steps.splice(R.i + 1, 0, { k: 'example' });
    }
    R.answered += 1; if (correct) R.correct += 1;
    persist();
  }
  function answer(val) {
    const R = S.run, it = R.item;
    if (R.state === 'right' || R.state === 'shown') return;
    R.tries += 1; R.picked = val;
    const ok = LK.check(it, val);
    if (ok) {
      R.state = 'right'; LK.sfx.correct();
      const c = LK.ui.am.correct, ce = LK.ui.en.correct, k = Math.floor(Math.random() * c.length);
      R.msg = { am: c[k], en: ce[k] }; R.line = lineFixed('ui.correct.' + k, c[k], ce[k]);
      finishItem(true);
    } else if (R.tries < 2) {
      R.state = 'retry'; LK.sfx.retry(); R.msg = { am: LK.ui.am.tryAgain, en: LK.ui.en.tryAgain }; say(lineFixed('ui.tryAgain', R.msg.am, R.msg.en));
    } else {
      R.state = 'shown'; R.hintOn = true; LK.sfx.reveal();
      const shown = it.input === 'pick' ? (it.answer === 'left' ? U().left : U().right) : it.answer;
      R.msg = { am: LK.fill(LK.ui.am.reveal, { ans: it.input === 'pick' ? LK.ui.am[it.answer] : shown }), en: LK.fill(LK.ui.en.reveal, { ans: it.input === 'pick' ? LK.ui.en[it.answer] : shown }) };
      R.line = { am: R.msg.am, en: R.msg.en, keys: NR.tplKeys('ui.reveal', LK.ui.am.reveal, { ans: it.answer }) };
      finishItem(false);
    }
    render();
    if (R.state === 'right' || R.state === 'shown') say(R.line);
  }
  function persist() {
    const R = S.run;
    if (R && R.guest) return;
    save();
  }
  function closeRun() {
    const R = S.run; if (!R || R.closed) return;
    R.closed = true;
    const L = learner();
    if (R.kind === 'diag' && R.diag.length) LK.applyDiagnostic(L, R.diag);
    if (R.answered) L.sessions.push({ start: R.started, end: Date.now(), kind: R.kind, skill: R.skill || null, answered: R.answered, correct: R.correct });
    if (!R.guest) save();
  }

  // ---------- grown-ups ----------
  function gateView() {
    const g = S.gate;
    return `<main class="wrap play parents"><div class="section"><h2>Grown-ups only</h2><p>To open this page, answer this question. It keeps children on the playing side.</p>
      <form data-form="gate" class="formrow"><label for="gate-answer">What is ${g.a} × ${g.b}?</label><input id="gate-answer" type="number" inputmode="numeric" autocomplete="off" required>
      ${g.err ? '<p style="color:var(--berry)">That is not right. Try again, or ask a grown-up.</p>' : ''}
      <div class="actions"><button class="btn" type="submit">Open</button><button class="btn alt" type="button" data-act="${active() ? 'home' : 'landing'}">Back</button></div></form></div></main>`;
  }
  function fmtDate(t) { return t ? new Date(t).toLocaleDateString(undefined, { month: 'short', day: 'numeric' }) : '—'; }
  function parentsView() {
    const p = active(); const s = st();
    const kidsList = DB.profiles.map((k) => `<button class="kidbtn" data-act="pick-kid" data-id="${k.id}" aria-pressed="${k.id === DB.activeId}" aria-label="${esc(k.name)}">${A.kid(k.avatar, k.name)}</button>`).join('');
    let report = '<p class="muted">Add a child profile to see a progress report.</p>';
    if (p) {
      const L = p.learner, rows = LK.report(L), rec = LK.recommend(L);
      const answered = rows.reduce((a, r) => a + r.attempts, 0), first = rows.reduce((a, r) => a + r.firstTry, 0);
      const mins = Math.round(L.sessions.reduce((a, x) => a + Math.min(30 * 6e4, x.end - x.start), 0) / 6e4);
      const recText = rec.kind === 'diagnostic' ? 'Play the starting game' : rec.kind === 'review' ? `Review: ${LK.lessons.find((l) => l.id === rec.skill).title.en}` : rec.kind === 'complete' ? 'Unit complete — keep reviewing' : `Lesson ${LK.lessons.find((l) => l.id === rec.skill).n}: ${LK.lessons.find((l) => l.id === rec.skill).title.en}`;
      const tagFor = (r) => r.status === 'mastered' ? (r.dueNow ? '<span class="tag adey">Review due</span>' : '<span class="tag field">Mastered</span>') : r.attempts ? '<span class="tag lake">Learning</span>' : '<span class="tag plain">Not started</span>';
      report = `<div class="tiles"><div class="tile"><b class="tnum">${L.sessions.length}</b>sessions</div><div class="tile"><b class="tnum">${mins}</b>minutes</div><div class="tile"><b class="tnum">${answered}</b>questions</div><div class="tile"><b class="tnum">${answered ? Math.round((first / answered) * 100) + '%' : '—'}</b>right first try, no hint</div></div>
        <p><b>Next:</b> ${esc(recText)}</p>
        <div class="tablewrap"><table><thead><tr><th>Skill</th><th>Status</th><th>Level</th><th>First try</th><th>Hints</th><th>Next review</th></tr></thead><tbody>
        ${rows.map((r) => { const l = LK.lessons.find((x) => x.id === r.id); return `<tr><td>${l.n}. ${esc(l.title.en)}<span class="en-sub am" lang="am">${esc(l.title.am)}</span></td><td>${tagFor(r)}</td><td class="tnum">${r.status === 'mastered' ? '3 ✓' : r.level + ' of 3'}${!r.attempts && p.learner.diagnosticDone ? '<span class="en-sub">set by starting game</span>' : ''}</td><td class="tnum">${r.attempts ? `${r.firstTry} of ${r.attempts}` : '—'}</td><td class="tnum">${r.attempts ? r.hints : '—'}</td><td class="tnum">${r.status === 'mastered' ? fmtDate(r.reviewDue) : '—'}</td></tr>`; }).join('')}
        </tbody></table></div><p class="muted">Practice records show where to help. They are not test scores. Level rises after 4 of the last 5 questions are right on the first try without a hint, and drops after two unsolved questions in a row.</p>`;
    }
    const confirm = S.confirm ? `<div class="confirm" role="alert"><b>${S.confirm === 'wipe' ? 'Delete all profiles and progress on this device?' : `Remove ${esc((DB.profiles.find((k) => k.id === S.confirm) || {}).name || '')}'s profile and progress?`}</b><p>This cannot be undone unless you copied a backup code.</p><div class="actions"><button class="btn small" style="background:var(--berry);color:#fff" data-act="confirm-yes">Delete</button><button class="btn alt small" data-act="confirm-no">Keep</button></div></div>` : '';
    return `<main class="wrap play parents">
      <div class="actions"><h1 style="font-size:1.8rem" class="grow">Grown-ups</h1><button class="btn adey small" data-act="home" ${p ? '' : 'disabled'}>Back to playing</button></div>
      ${S.parentMsg ? `<p class="panel" role="status">${esc(S.parentMsg)}</p>` : ''}
      <div class="section"><h2 style="font-size:1.3rem">Children</h2><div class="kids">${kidsList || '<p class="muted">No profiles yet.</p>'}</div>
        <form data-form="addkid" class="formrow"><label for="kid-name">Add a child: nickname only</label><input id="kid-name" type="text" maxlength="20" placeholder="e.g. Selam" autocomplete="off" required>
          <span class="muted">Choose a picture</span><div class="kids" role="radiogroup">${A.kidIds.map((k, i) => `<label class="kidbtn" style="display:inline-block"><input type="radio" name="avatar" value="${k}" ${i === 0 ? 'checked' : ''} style="position:absolute;opacity:0">${A.kid(k, k)}</label>`).join('')}</div>
          <div class="actions"><button class="btn" type="submit">Add child</button>${p ? `<button class="btn alt small" type="button" data-act="remove-kid" data-id="${p.id}">Remove ${esc(p.name)}</button>` : ''}</div></form></div>
      ${confirm}
      ${LK.adv.parentHTML(p)}
      <div class="section"><h2 style="font-size:1.3rem">${p ? `${esc(p.name)}'s practice` : 'Practice'}</h2>${report}</div>
      <div class="section"><h2 style="font-size:1.3rem">Settings</h2>
        <label class="toggle"><input type="checkbox" id="set-en" data-set="showEn" ${s.showEn ? 'checked' : ''}> Show English under Amharic</label>
        <label class="toggle"><input type="checkbox" id="set-motion" data-set="reduce" ${s.reduce ? 'checked' : ''}> Reduce motion</label>
        <label class="toggle"><input type="checkbox" id="set-sfx" data-set="sfx" ${s.sfx !== false ? 'checked' : ''}> Sound effects (gentle chimes for answers and counting)</label>
        <p class="muted">Narration: ${voiceFor('am') ? 'an Amharic voice was found on this device.' : 'this device has no Amharic voice, so the listen button shows a note instead. Recorded narration is being added.'}</p>
      </div>
      <div class="section"><h2 style="font-size:1.3rem">Backup and privacy</h2>
        <p>Progress is saved only in this browser on this device. Nothing is sent to us during this pilot build. Copy a backup code to move progress to another device or browser.</p>
        <div class="actions"><button class="btn alt small" data-act="backup">Copy backup code</button></div>
        <form data-form="restore" class="formrow"><label for="restore-code">Restore from a backup code</label><textarea id="restore-code" required></textarea><div class="actions"><button class="btn alt small" type="submit">Restore</button><button class="btn alt small" type="button" data-act="wipe">Delete everything on this device</button></div></form>
      </div></main>`;
  }

  // ---------- privacy notice and terms ----------
  function legalView(kind) {
    const L = LK.legal[kind];
    const mark = (t) => esc(t).replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>');
    const am = L.am ? `<section class="section am-summary" lang="am"><h2 style="font-size:1.25rem">${esc(L.am.title)}</h2><ul class="checks">${L.am.points.map((x) => `<li class="am">${esc(x)}</li>`).join('')}</ul><p class="muted" lang="en">Amharic summary: draft awaiting review by an Amharic-speaking educator.</p></section>` : '';
    return `<main class="wrap play legal">
      <div class="actions"><button class="btn alt small" data-act="${active() ? 'home' : 'landing'}">${ICON.back}Back</button></div>

      <h1>${esc(L.title)}</h1>
      <p class="muted">Effective date: ${mark(LK.company.effective)}</p>
      ${am}
      ${L.sections.map(([h, t]) => `<section class="legal-sec"><h2>${esc(h)}</h2><p>${mark(t)}</p></section>`).join('')}
      <p class="muted">Questions: <span class="copyable">${esc(LK.company.email)}</span></p>

    </main>`;
  }


  // Bonus games are intentionally separate from the adaptive lesson/mastery records.
  function miniQuestion(kind) {
    const a = 1 + Math.floor(Math.random() * 8);
    const b = 1 + Math.floor(Math.random() * (10 - a));
    if (kind === 'count') return { a, answer: a, label: {am:'ስንት ኮከቦች አሉ?',en:'How many stars can you count?'}, display: Array.from({length:a},()=>'<span aria-hidden="true">⭐</span>').join('') };
    if (kind === 'match') return { a, answer:a, label:{am:'ተመሳሳይ ቁጥር ምረጥ',en:'Match the number of dots'},display:Array.from({length:a},()=>'<span aria-hidden="true">🟣</span>').join('') };
    return { a, b, answer:a+b, label:{am:'ደምር።',en:'Add the numbers'},display:`${a} + ${b} = ?` };
  }
  function miniUnlocked(kind) {
    const scores = DB.miniBest || {};
    return kind === 'count' || (kind === 'match' && (scores.count || 0) >= 3) ||
      (kind === 'add' && (scores.match || 0) >= 3);
  }
  function miniStart(kind) {
    if (!miniUnlocked(kind)) { toast(lang()==='am'?'መጀመሪያ ያለፈውን ደረጃ ጨርስ።':'Complete the previous adventure first.'); return; }
    S.mini = { kind, round:1, score:0, q:miniQuestion(kind), picked:null, mistakes:0, done:false };
    go('mini');
  }
  function miniView() {
    const M=S.mini;
    const names={count:{am:'የቆጠራ ጀብዱ',en:'Counting Adventure'},match:{am:'ቁጥር አዛምድ',en:'Number Matching'},add:{am:'የመደመር ፈተና',en:'Addition Challenge'}};
    const name=names[M.kind];
    const msg=M.picked===null?'':M.picked===M.q.answer?(M.mistakes===0?(lang()==='am'?'በጣም ጥሩ! 🌟':'Great job! 🌟'):(lang()==='am'?'ጥሩ! በመሞከር ተማርክ።':'Nice recovery! Keep practicing.')):(lang()==='am'?'እንደገና ሞክር።':'Try again!');
    const choices=[M.q.answer,M.q.answer-1,M.q.answer+1,M.q.answer+2].filter(n=>n>=0&&n<=20);
    return `<main class="wrap play mini-game">
      <button class="btn alt small" data-act="mini-exit">${ICON.back}${lang()==='am'?'ተመለስ':'Back'}</button>
      <div class="mini-card"><div class="mini-top"><h1>${bi(name)}</h1><strong>${M.round}/5 · ⭐ ${M.score}</strong></div>
      ${M.done?`<div class="mini-finish" role="status">${A.wali('celebrate','Wali celebrating')}<h2>${lang()==='am'?'እንኳን ደስ አለህ!':'Adventure complete!'}</h2><p>${M.score} / 5</p><button class="btn adey" data-act="mini-restart">${lang()==='am'?'እንደገና ተጫወት':'Play again'}</button></div>`:
      `<div class="mini-track"><span style="width:${(M.round-1)*20}%"></span></div>
      <h2>${bi(M.q.label)}</h2><div class="mini-visual ${M.kind==='add'?'mini-equation':'mini-objects'}" aria-label="${M.kind==='add'?'Addition problem':'Count the objects'}">${M.q.display}</div>
      <div class="mini-options">${choices.map(n=>`<button class="opt ${M.picked===n?(n===M.q.answer?'right':'wrong'):''}" data-act="mini-answer" data-v="${n}" ${M.picked===M.q.answer?'disabled':''}>${n}</button>`).join('')}</div>
      <p class="mini-message" role="status" aria-live="polite">${msg}</p>
      ${M.picked===M.q.answer?`<button class="btn adey" data-act="mini-next">${M.round===5?(lang()==='am'?'ጨርስ':'Finish'):(lang()==='am'?'ቀጣይ':'Next')} →</button>`:''}`}
      </div></main>`;
  }
  function miniHub() {
    const games=[
      ['count','🌟','የቆጠራ ጀብዱ','Counting Adventure','🌼'],
      ['match','🟣','ቁጥር አዛምድ','Number Matching','🏞️'],
      ['add','➕','የመደመር ፈተና','Addition Challenge','🏔️']
    ];
    const scores=DB.miniBest||{};
    return `<section class="mini-hub" aria-label="Math adventure map">
      <h2>${lang()==='am'?'🗺️ የሂሳብ ጀብዱ ካርታ':'🗺️ Math Adventure Map'}</h2>
      <p class="muted">${lang()==='am'?'በእያንዳንዱ ደረጃ ከ5 ቢያንስ 3 ኮከቦችን ሰብስብ።':'Earn at least 3 out of 5 stars to unlock the next adventure.'}</p>
      <div class="adventure-map">${games.map((g,i)=>{
        const unlocked=miniUnlocked(g[0]),best=scores[g[0]]||0;
        return `<div class="adventure-stop ${unlocked?'':'locked'}">
          <span class="adventure-scene" aria-hidden="true">${g[4]}</span>
          <span class="adventure-step">${i+1}</span>
          <button class="mini-tile" data-act="mini-start" data-v="${g[0]}" ${unlocked?'':'disabled'} aria-label="${g[3]} ${unlocked?'':'locked'}">
            <span aria-hidden="true">${unlocked?g[1]:'🔒'}</span><b>${lang()==='am'?g[2]:g[3]}</b>
            <small>${unlocked?'⭐ '+best+' / 5':(lang()==='am'?'ዝግ ነው':'Locked')}</small>
          </button>
        </div>`;
      }).join('<span class="adventure-trail" aria-hidden="true">···</span>')}</div>
      <p class="muted">${lang()==='am'?'ዋሊ ከአንተ ጋር ይጓዛል!':'Wali travels with you through every level!'}</p>
    </section>`;
  }

  // ---------- render ----------
  function render() {
    applySettings();
    let main = '';
    if (S.view === 'landing') main = landing();
    else if (S.view === 'home') main = home();
    else if (S.view === 'run') main = runView();
    else if (S.view === 'mini') main = miniView();
    else if (S.view === 'adv') main = LK.adv.view();
    else if (S.view === 'adv-wardrobe') main = LK.adv.wardrobeHTML();
    else if (S.view === 'gate') main = gateView();
    else if (S.view === 'parents') main = parentsView();
    else if (S.view === 'privacy' || S.view === 'terms') main = legalView(S.view);
    root.innerHTML = header() + main;
    if (S.view === 'adv') LK.adv.paint();
    if (S.view === 'parents') LK.adv.paintParents();
  }
  function go(view) { S.view = view; render(); window.scrollTo(0, 0); }

  // ---------- events ----------
  root.addEventListener('click', (e) => {
    const R = S.run;
    // Taps inside math pictures
    const vis = e.target.closest('.visual');
    if (vis && R && R.item && R.state !== 'right' && R.state !== 'shown') {
      const it = R.item;
      const obj = e.target.closest('[data-obj]');
      if (it.type === 'count' && obj) {
        const i = obj.getAttribute('data-i');
        if (!R.tapped.includes(i)) {
          R.tapped.push(i); obj.classList.add('tapped'); LK.sfx.count(R.tapped.length);
          const ns = 'http://www.w3.org/2000/svg';
          const c = document.createElementNS(ns, 'circle'); c.setAttribute('r', '11'); c.setAttribute('class', 'tapdot'); c.setAttribute('cy', '-2');
          const t = document.createElementNS(ns, 'text'); t.setAttribute('class', 'tapnum'); t.setAttribute('text-anchor', 'middle'); t.setAttribute('y', '3'); t.textContent = R.tapped.length;
          const g = document.createElementNS(ns, 'g'); g.appendChild(c); g.appendChild(t); obj.parentNode.insertBefore(g, obj.nextSibling);
          g.setAttribute('transform', obj.getAttribute('transform'));
          const lbl = $('.counted', root); if (lbl) lbl.textContent = R.tapped.length;
          { const n = R.tapped.length; say({ am: LK.numWords.am[n] || String(n), en: LK.numWords.en[n] || String(n), keys: ['num.' + n] }); }
        }
        return;
      }
      const side = e.target.closest('[data-side]');
      if (it.input === 'pick' && side) { answer(side.getAttribute('data-side')); return; }
      const tick = e.target.closest('[data-n]');
      if (it.input === 'line' && tick) { answer(Number(tick.getAttribute('data-n'))); return; }
      const cell = e.target.closest('[data-cell]');
      if (it.input === 'build' && cell) { toggleCell(cell); return; }
    }
    const b = e.target.closest('[data-act]'); if (!b) return;
    const act = b.getAttribute('data-act');
    if (act === 'mini-start') { miniStart(b.getAttribute('data-v')); return; }
    if (act === 'mini-exit') { S.mini = null; go('home'); return; }
    if (act === 'mini-restart') { miniStart(S.mini.kind); return; }
    if (act === 'mini-answer') {
      const M=S.mini; if (!M||M.done||M.picked===M.q.answer) return;
      M.picked=Number(b.getAttribute('data-v'));
      if (M.picked===M.q.answer) { if (M.mistakes===0) M.score++; LK.sfx.correct && LK.sfx.correct(); }
      else M.mistakes++;
      render(); return;
    }
    if (act === 'mini-next') {
      const M=S.mini; if (!M || M.picked!==M.q.answer) return;
      if (M.round===5) { M.done=true; DB.miniBest=DB.miniBest||{}; DB.miniBest[M.kind]=Math.max(DB.miniBest[M.kind]||0,M.score); save(); }
      else { M.round++; M.q=miniQuestion(M.kind); M.picked=null; M.mistakes=0; }
      render(); return;
    }
    if (act === 'lang') { st().lang = b.getAttribute('data-v'); save(); render(); return; }
    if (act === 'landing') { S.run = null; go('landing'); return; }
    if (act === 'legal') { if (R) { closeRun(); S.run = null; } go(b.getAttribute('data-v')); return; }
    if (act === 'home') {
      if (R) { closeRun(); const wasGuest = R.guest; S.run = null; if (wasGuest && !active()) { go('landing'); return; } }
      go(active() || S.guest ? 'home' : 'landing'); return;
    }
    if (act === 'gate') { S.gate = { a: 6 + Math.floor(Math.random() * 4), b: 6 + Math.floor(Math.random() * 4), err: false }; if (R) { closeRun(); S.run = null; } go('gate'); return; }
    if (act === 'sample') { if (!active()) { S.guest = S.guest || LK.newLearner(); S.guest.diagnosticDone = true; } LK.sfx.unlock && LK.sfx.unlock(); LK.adv.start(b.getAttribute('data-skill')); window.scrollTo(0, 0); return; }
    if (act === 'lesson') { const sk = b.getAttribute('data-skill'); if (R) closeRun(); newRun('lesson', sk, R ? R.guest : !active()); window.scrollTo(0, 0); return; }
    if (act === 'review') { newRun('review', b.getAttribute('data-skill')); return; }
    if (act === 'diag') { newRun('diag', null); return; }
    if (act === 'next') { R.i = Math.min(R.i + 1, R.steps.length - 1); if (R.steps[R.i].k === 'done') { closeRun(); if (R.events.includes('badge')) setTimeout(() => LK.sfx.badge(), 250); } enterStep(); window.scrollTo(0, 0); return; }
    if (act === 'answer') { const v = b.getAttribute('data-v'); answer(R.item.input === 'pick' ? v : Number(v)); return; }
    if (act === 'hint') { R.hints += 1; R.hintOn = true; render(); say(itemLine(R.item, 'hint')); return; }
    if (act === 'buildcheck') { answer(R.built.size); return; }
    if (act === 'speak') { say(currentLine(), true); return; }
    if (act === 'reserve') { S.reserve = true; render(); const el = $('#pilot'); if (el) el.scrollIntoView({ block: 'start' }); return; }
    if (act === 'copy') { const el = document.getElementById(b.getAttribute('data-target')); copyText(el.textContent, el); return; }
    if (act === 'pick-kid') { DB.activeId = b.getAttribute('data-id'); save(); render(); return; }
    if (act === 'remove-kid') { S.confirm = b.getAttribute('data-id'); render(); return; }
    if (act === 'wipe') { S.confirm = 'wipe'; render(); return; }
    if (act === 'confirm-no') { S.confirm = null; render(); return; }
    if (act === 'confirm-yes') {
      if (S.confirm === 'wipe') { DB.profiles = []; DB.activeId = null; try { localStorage.removeItem(STORE); } catch (err) { /* ignore */ } S.parentMsg = 'Everything on this device was deleted.'; }
      else { DB.profiles = DB.profiles.filter((k) => k.id !== S.confirm); if (DB.activeId === S.confirm) DB.activeId = DB.profiles[0] ? DB.profiles[0].id : null; save(); S.parentMsg = 'Profile removed.'; }
      S.confirm = null; render(); return;
    }
    if (act === 'backup') {
      let code = '';
      try { code = btoa(unescape(encodeURIComponent(JSON.stringify(DB)))); } catch (err) { code = ''; }
      copyText(code, null); S.parentMsg = 'Backup code copied. Paste it somewhere safe, such as a note to yourself.'; render(); return;
    }
  });
  root.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.matches('.tap[tabindex]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent('click', { bubbles: true })); }
  });
  root.addEventListener('change', (e) => {
    const k = e.target.getAttribute('data-set'); if (!k) return;
    st()[k] = e.target.checked; save(); render();
  });
  root.addEventListener('submit', (e) => {
    e.preventDefault();
    const f = e.target.getAttribute('data-form');
    if (f === 'gate') {
      const v = Number($('#gate-answer').value);
      if (v === S.gate.a * S.gate.b) { S.parentMsg = ''; go('parents'); } else { S.gate.err = true; render(); }
    } else if (f === 'addkid') {
      const name = $('#kid-name').value.trim().slice(0, 20); if (!name) return;
      const av = (e.target.querySelector('input[name="avatar"]:checked') || {}).value || 'selam';
      const id = 'k' + Date.now().toString(36);
      DB.profiles.push({ id, name, avatar: av, learner: LK.newLearner() }); DB.activeId = id;
      S.parentMsg = save() ? `${name} was added. Tap “Back to playing” to start with the starting game.` : `${name} was added for this visit, but this browser is not saving data, so progress will be lost when the page closes.`;
      render();
    } else if (f === 'restore') {
      try {
        const data = JSON.parse(decodeURIComponent(escape(atob($('#restore-code').value.trim()))));
        if (!data || !Array.isArray(data.profiles)) throw new Error('bad');
        DB.profiles = data.profiles; DB.activeId = data.activeId; DB.settings = Object.assign(DB.settings, data.settings || {});
        save(); S.parentMsg = `Restored ${data.profiles.length} profile(s).`;
      } catch (err) { S.parentMsg = 'That code could not be read. Copy the whole code and try again.'; }
      render();
    }
  });

  function toggleCell(cell) {
    LK.sfx.tap();
    const R = S.run, i = cell.getAttribute('data-cell');
    const ns = 'http://www.w3.org/2000/svg';
    if (R.built.has(i)) { R.built.delete(i); const g = cell.querySelector('[data-obj]'); if (g) g.remove(); cell.setAttribute('data-filled', '0'); }
    else {
      R.built.add(i); cell.setAttribute('data-filled', '1');
      const r = cell.querySelector('rect'); const x = +r.getAttribute('x') + 25, y = +r.getAttribute('y') + 25;
      const g = document.createElementNS(ns, 'g'); g.setAttribute('data-obj', 'counter'); g.setAttribute('transform', `translate(${x} ${y})`);
      const c = document.createElementNS(ns, 'circle'); c.setAttribute('r', '16'); c.setAttribute('class', 'mv-counter'); g.appendChild(c); cell.appendChild(g);
    }
    const lbl = $('.counted', root); if (lbl) lbl.textContent = `${R.built.size} / 10`;
  }
  function itemLine(it, which) {
    const src = which === 'hint' ? LK.hints[it.hint] : LK.prompts[it.prompt];
    return lineTpl((which === 'hint' ? 'hint.' + it.hint : 'prompt.' + it.prompt), src, it.vars, it.thing);
  }
  function currentLine() {
    const R = S.run; if (!R) return null;
    const step = R.steps[R.i];
    const lesson = R.skill ? LK.lessons.find((x) => x.id === R.skill) : null;
    if (step.k === 'intro') return lineFixed('ui.diagnosticIntro', LK.ui.am.diagnosticIntro, LK.ui.en.diagnosticIntro);
    if (step.k === 'story') return { am: lesson.title.am + '። ' + lesson.story.am, en: lesson.title.en + '. ' + lesson.story.en, keys: ['lesson.' + lesson.id + '.title', 'lesson.' + lesson.id + '.story'] };
    if (step.k === 'example') return lineFixed('lesson.' + lesson.id + '.example', lesson.example.am, lesson.example.en);
    if (step.k === 'item') return itemLine(R.item, 'prompt');
    if (step.k === 'done') return lineFixed('ui.lessonDone', LK.ui.am.lessonDone, LK.ui.en.lessonDone);
    return null;
  }
  function copyText(text, el) {
    const done = () => toast('Copied');
    try {
      navigator.clipboard.writeText(text).then(done, () => fallback());
    } catch (err) { fallback(); }
    function fallback() {
      if (el) { const r = document.createRange(); r.selectNodeContents(el); const s = window.getSelection(); s.removeAllRanges(); s.addRange(r); toast('Press copy on your keyboard or menu'); }
      else { S.parentMsg = 'Copy did not work here. Your code: ' + text; render(); }
    }
  }

  // ---------- hands-on lessons ----------
  LK.adv.init({
    say, save, learner, go, render, active, toast,
    lang: () => lang(), st: () => st(),
    isGuest: () => !active(),
    ensureLearner: () => { if (!learner()) { S.guest = LK.newLearner(); S.guest.diagnosticDone = true; } return learner(); },
    homeOrLanding: () => (active() || S.guest ? 'home' : 'landing')
  });

  // ---------- start ----------
  const route = (location.hash || '').slice(1) || location.pathname.replace(/^\//, '');
  if (route === 'privacy' || route === 'terms') S.view = route;
  else if (route === 'parents') S.gate = { a: 7, b: 8, err: false }, S.view = 'gate';
  else if (active()) S.view = 'home';
  render();
  NR.load().then((n) => { if (n) S.clips = n; });
  LK.app = { S, DB, render, newRun, say, save, learner, go, active };
})();
</script>
