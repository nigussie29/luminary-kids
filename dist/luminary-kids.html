<title>Luminary Kids</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Luminary Kids — Amharic-first hands-on math lessons for Grades 1–3.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@700;800&family=Noto+Sans+Ethiopic:wght@400;600;700&display=swap">
<style>/* Layout: one narrow play column (max 720px) for children; wider bands (max 1040px) for the grown-up landing page.
   Palette from the Ethiopian highlands: mist ground, indigo ink, Adey Abeba marigold, lake teal, field green, coffee-berry. */
:root {
  --bg: #f2f6f3;
  --surface: #ffffff;
  --tray: #e9f0ea;
  --ink: #1d2540;
  --muted: #586178;
  --line: #d3dcdb;
  --adey: #f2b705;
  --adey-soft: #fff1c2;
  --adey-ink: #5a4300;
  --lake: #1f7a8c;
  --lake-soft: #d9eef2;
  --field: #2f8f5b;
  --field-soft: #dcf1e4;
  --berry: #b8456e;
  --berry-soft: #f8e1ea;
  --shadow: 0 1px 0 rgba(29, 37, 64, .06), 0 8px 24px -12px rgba(29, 37, 64, .25);
  --f-body: 'Andika', 'Noto Sans Ethiopic', 'Nyala', system-ui, sans-serif;
  --f-display: 'Baloo 2', 'Noto Sans Ethiopic', 'Nyala', system-ui, sans-serif;
  --f-eth: 'Noto Sans Ethiopic', 'Abyssinica SIL', 'Nyala', sans-serif;
  --r: 18px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11182a; --surface: #1a2338; --tray: #222c45; --ink: #eef1f7; --muted: #a6afc4; --line: #2f3a56;
    --adey: #f5c33b; --adey-soft: #3d3313; --adey-ink: #ffe6a0; --lake: #56b6c9; --lake-soft: #173a44;
    --field: #5cc48a; --field-soft: #183a29; --berry: #e483a8; --berry-soft: #43222f;
    --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .7); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11182a; --surface: #1a2338; --tray: #222c45; --ink: #eef1f7; --muted: #a6afc4; --line: #2f3a56;
  --adey: #f5c33b; --adey-soft: #3d3313; --adey-ink: #ffe6a0; --lake: #56b6c9; --lake-soft: #173a44;
  --field: #5cc48a; --field-soft: #183a29; --berry: #e483a8; --berry-soft: #43222f;
  --shadow: 0 1px 0 rgba(0, 0, 0, .3), 0 10px 26px -14px rgba(0, 0, 0, .7); color-scheme: dark;
}

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.55; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
:lang(am), .am { font-family: var(--f-eth); line-height: 1.7; }
h1, h2, h3 { font-family: var(--f-display); line-height: 1.15; text-wrap: balance; margin: 0; }
h1 { font-size: clamp(2rem, 6vw, 3.2rem); font-weight: 800; letter-spacing: -.01em; }
h2 { font-size: clamp(1.5rem, 4vw, 2.1rem); font-weight: 700; }
h3 { font-size: 1.2rem; font-weight: 700; }
p { margin: 0; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--lake); outline-offset: 3px; border-radius: 8px; }
.wrap { width: 100%; max-width: 1040px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.play { max-width: 720px; }
.eyebrow { font-size: .78rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 700; color: var(--lake); }
.muted { color: var(--muted); }
.en-sub { display: block; font-family: var(--f-body); font-size: .82em; color: var(--muted); line-height: 1.4; margin-top: 2px; }
.tnum { font-variant-numeric: tabular-nums; }

/* header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.top .wrap { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.brand { display: flex; align-items: center; gap: 10px; background: none; border: 0; cursor: pointer; padding: 0; text-align: left; min-width: 0; }
.brand-mark { width: 40px; height: 40px; flex: none; }
.brand b { font-family: var(--f-display); font-size: 1.15rem; display: block; line-height: 1; }
.brand small { font-family: var(--f-eth); color: var(--muted); font-size: .8rem; display: block; }
.top .spacer { flex: 1; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--bg); }
.seg button { border: 0; background: none; border-radius: 999px; padding: 6px 12px; min-height: 36px; cursor: pointer; font-weight: 700; }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.linkbtn { background: none; border: 0; color: var(--lake); font-weight: 700; cursor: pointer; padding: 8px 4px; min-height: 44px; }
.stars { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; background: var(--adey-soft); color: var(--adey-ink); border-radius: 999px; padding: 4px 12px; }
.stars svg { width: 18px; height: 18px; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 14px; padding: 12px 22px; min-height: 52px; font-weight: 700; font-size: 1.05rem; cursor: pointer; background: var(--ink); color: var(--bg); transition: transform .12s; }
.btn:active { transform: translateY(1px); }
.btn.alt { background: var(--surface); color: var(--ink); border: 2px solid var(--line); }
.btn.adey { background: var(--adey); color: #2a2000; }
.btn.small { min-height: 44px; padding: 8px 14px; font-size: .95rem; }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.icon { width: 20px; height: 20px; flex: none; }

/* landing */
.hero { padding-block: 40px 28px; }
.hero .wrap { display: grid; grid-template-columns: 1.15fr .85fr; gap: 28px; align-items: center; }
.hero h1 .am { display: block; font-size: .62em; color: var(--lake); margin-bottom: 6px; font-weight: 700; }
.hero p.lead { font-size: 1.15rem; margin-top: 14px; max-width: 34em; }
.hero .ctas { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 22px; }
.hero-art { position: relative; border-radius: 28px; overflow: hidden; background: var(--tray); }
.hero-art .scene { display: block; width: 100%; height: auto; }
.hero-art .wali { position: absolute; width: 46%; right: 4%; bottom: 0; }
.hero-art .bubble { position: absolute; left: 5%; top: 8%; max-width: 54%; }
.bubble { background: var(--surface); border-radius: 16px; padding: 10px 14px; box-shadow: var(--shadow); font-size: .98rem; }
.band { padding-block: 36px; }
.band.tint { background: var(--surface); border-block: 1px solid var(--line); }
.band h2 { margin-bottom: 8px; }
.band .intro { max-width: 40em; margin-bottom: 20px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.point { display: grid; gap: 6px; }
.point .dot { width: 40px; height: 40px; border-radius: 12px; display: grid; place-items: center; font-weight: 800; font-family: var(--f-display); }
.steps { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; counter-reset: s; list-style: none; padding: 0; margin: 0; }
.steps li { background: var(--bg); border-radius: var(--r); padding: 16px; counter-increment: s; }
.steps li::before { content: counter(s); display: inline-grid; place-items: center; width: 30px; height: 30px; border-radius: 50%; background: var(--adey); color: #2a2000; font-weight: 800; margin-bottom: 8px; }
.lessons { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.lcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); overflow: hidden; display: grid; text-align: left; padding: 0; cursor: pointer; }
.lcard .scene { width: 100%; height: auto; display: block; }
.lcard .body { padding: 12px 14px 14px; display: grid; gap: 2px; }
.lcard .num { font-size: .78rem; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
.report-demo { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; }
.offer { display: grid; grid-template-columns: 1.1fr .9fr; gap: 20px; align-items: start; }
.price { background: var(--surface); border: 2px solid var(--adey); border-radius: 22px; padding: 22px; display: grid; gap: 12px; }
.price .amt { font-family: var(--f-display); font-size: 2.6rem; font-weight: 800; line-height: 1; }
.tag { display: inline-block; font-size: .78rem; font-weight: 700; border-radius: 999px; padding: 3px 10px; background: var(--adey-soft); color: var(--adey-ink); }
.tag.lake { background: var(--lake-soft); color: var(--lake); }
.tag.field { background: var(--field-soft); color: var(--field); }
.tag.berry { background: var(--berry-soft); color: var(--berry); }
.tag.plain { background: var(--tray); color: var(--muted); }
.checks { list-style: none; padding: 0; margin: 0; display: grid; gap: 8px; }
.checks li { display: grid; grid-template-columns: 22px 1fr; gap: 8px; }
.checks li::before { content: ""; width: 18px; height: 18px; margin-top: 4px; border-radius: 50%; background: var(--field-soft); box-shadow: inset 0 0 0 5px var(--field); }
.terms { font-size: .92rem; color: var(--muted); display: grid; gap: 6px; }
.panel { background: var(--lake-soft); border-radius: 14px; padding: 14px; display: grid; gap: 8px; }
.copyrow { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.copyrow code { background: var(--surface); padding: 6px 10px; border-radius: 8px; user-select: all; overflow-wrap: anywhere; }
details.faq { border-top: 1px solid var(--line); padding-block: 12px; }
details.faq summary { cursor: pointer; font-weight: 700; min-height: 32px; }
details.faq p { margin-top: 8px; max-width: 46em; }
footer { padding-block: 28px 40px; color: var(--muted); font-size: .9rem; }

/* child home */
.home { padding-block: 18px 40px; display: grid; gap: 18px; }
.greet { display: grid; grid-template-columns: 130px 1fr; gap: 14px; align-items: end; }
.greet .wali { width: 130px; height: auto; }
.next-card { background: var(--surface); border-radius: 22px; box-shadow: var(--shadow); overflow: hidden; display: grid; grid-template-columns: 1fr 1fr; }
.next-card .scene { width: 100%; height: 100%; object-fit: cover; display: block; }
.next-card .body { padding: 18px; display: grid; gap: 10px; align-content: center; }
.path { list-style: none; padding: 0; margin: 0; display: grid; gap: 10px; }
.stone { width: 100%; display: grid; grid-template-columns: 64px 1fr auto; gap: 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 8px 12px 8px 8px; cursor: pointer; text-align: left; min-height: 72px; }
.stone .badge { width: 56px; height: 56px; }
.stone[data-locked="1"] { opacity: .75; }
.lv { display: inline-flex; gap: 4px; }
.lv i { width: 12px; height: 12px; border-radius: 50%; background: var(--line); display: block; }
.lv i.on { background: var(--field); }
.garden { background: var(--field-soft); border-radius: 22px; padding: 14px; }
.garden .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
.garden .badge { width: 54px; height: 54px; }

/* lesson player */
.player { padding-block: 14px 40px; display: grid; gap: 14px; }
.bar { display: flex; align-items: center; gap: 10px; }
.progress { flex: 1; height: 12px; background: var(--tray); border-radius: 999px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--field); border-radius: 999px; transition: width .3s; }
.card { background: var(--surface); border-radius: 24px; box-shadow: var(--shadow); padding: 18px; display: grid; gap: 14px; }
.prompt-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; }
.prompt { font-size: clamp(1.25rem, 4.6vw, 1.6rem); font-weight: 700; }
.listen { width: 52px; height: 52px; border-radius: 16px; border: 0; background: var(--lake-soft); color: var(--lake); cursor: pointer; display: grid; place-items: center; }
.listen .icon { width: 26px; height: 26px; }
.visual { display: grid; place-items: center; background: var(--tray); border-radius: 18px; padding: 12px; overflow-x: auto; }
.visual svg { width: 100%; max-width: 420px; height: auto; display: block; }
.visual svg.line { max-width: 640px; }
.visual svg.scene { max-width: 100%; border-radius: 12px; }
.visual-wrap { overflow-x: auto; }
.opts { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.opts.two { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.opt { min-height: 72px; border-radius: 18px; border: 2px solid var(--line); background: var(--surface); font-family: var(--f-display); font-size: 2rem; font-weight: 800; cursor: pointer; }
.opt.word { font-family: var(--f-eth); font-size: 1.3rem; }
.opt:hover { border-color: var(--lake); }
.opt.right { background: var(--field-soft); border-color: var(--field); color: var(--field); }
.opt.wrong { background: var(--berry-soft); border-color: var(--berry); color: var(--berry); }
.actions { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.actions .grow { flex: 1; }
.feedback { display: grid; grid-template-columns: 76px 1fr; gap: 12px; align-items: center; border-radius: 18px; padding: 10px 14px; }
.feedback .wali { width: 76px; height: auto; }
.feedback.ok { background: var(--field-soft); }
.feedback.retry { background: var(--adey-soft); }
.feedback.show { background: var(--lake-soft); }
.hintbox { background: var(--adey-soft); color: var(--adey-ink); border-radius: 14px; padding: 10px 14px; }
.story { display: grid; gap: 12px; }
.story .stage { position: relative; }
.story .stage .scene { width: 100%; height: auto; border-radius: 18px; display: block; }
.story .stage .wali { position: absolute; width: 34%; right: 2%; bottom: -4px; }
.counted { font-weight: 700; color: var(--lake); }
.done { text-align: center; justify-items: center; }
.done .wali { width: 180px; }
.done .badge { width: 120px; }
.kids { display: flex; gap: 10px; flex-wrap: wrap; }
.kidbtn { border: 3px solid transparent; border-radius: 50%; padding: 0; background: none; cursor: pointer; width: 76px; height: 76px; }
.kidbtn[aria-pressed="true"] { border-color: var(--adey); }
.kidbtn svg { width: 100%; height: 100%; }

/* svg math visuals — theme aware */
.mv .mv-frame { fill: var(--surface); stroke: var(--ink); stroke-width: 3; }
.mv .mv-cell { fill: none; stroke: var(--ink); stroke-width: 1.5; }
.mv .mv-counter { fill: var(--lake); }
.mv .mv-counter.cb, .mv .cb .mv-counter { fill: var(--berry); }
.mv .mv-tray { fill: var(--surface); stroke: var(--line); stroke-width: 2; }
.mv .mv-tray.dashed { stroke-dasharray: 8 6; stroke: var(--muted); }
.mv .mv-line { stroke: var(--ink); stroke-width: 3; stroke-linecap: round; }
.mv .mv-num { fill: var(--ink); font-family: var(--f-display); font-weight: 700; font-size: 22px; }
.mv .mv-num.small { font-size: 15px; }
.mv text.mv-num[text-anchor] { font-size: 40px; }
.mv .tick text.mv-num { font-size: 30px; }
.mv .tick text.mv-num.small { font-size: 15px; }
.mv .mv-mark { fill: var(--adey); stroke: var(--ink); stroke-width: 2; }
.mv .mv-start { fill: var(--lake); stroke: var(--surface); stroke-width: 3; }
.mv .mv-hop { fill: none; stroke: var(--berry); stroke-width: 3; }
.mv .mv-arrowhead { fill: var(--berry); }
.mv .mv-cross { stroke: var(--berry); stroke-width: 5; stroke-linecap: round; }
.mv .hit { fill: transparent; }
.mv .tap { cursor: pointer; }
.mv .tick.sel .mv-num { fill: var(--lake); }
.mv .tick.sel line { stroke: var(--lake); }
.mv .tick.right .mv-num { fill: var(--field); }
.mv .side.sel .mv-tray { stroke: var(--lake); stroke-width: 4; }
.mv .obj.tapped { opacity: .55; }
.mv .tapnum { fill: var(--bg); font: 700 15px var(--f-display); }
.mv .tapdot { fill: var(--ink); }
.mv .cell.tap:hover .mv-cell { fill: var(--lake-soft); }

/* toast */
.toast { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; max-width: calc(100% - 32px); z-index: 20; font-size: .95rem; }

/* grown-ups */
.parents { padding-block: 20px 48px; display: grid; gap: 18px; }
.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.tile b { display: block; font-family: var(--f-display); font-size: 1.8rem; line-height: 1.1; }
.tablewrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; }
table { border-collapse: collapse; width: 100%; font-size: .95rem; }
th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .78rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
tr:last-child td { border-bottom: 0; }
.formrow { display: grid; gap: 6px; }
input[type="text"], input[type="number"], textarea { font: inherit; color: var(--ink); background: var(--surface); border: 2px solid var(--line); border-radius: 12px; padding: 10px 12px; min-height: 48px; width: 100%; }
textarea { min-height: 90px; }
.toggle { display: flex; align-items: center; gap: 10px; min-height: 44px; }
.toggle input { width: 22px; height: 22px; }
.section { background: var(--surface); border: 1px solid var(--line); border-radius: 20px; padding: 16px; display: grid; gap: 12px; }
.confirm { background: var(--berry-soft); border-radius: 12px; padding: 12px; display: grid; gap: 8px; }

@media (max-width: 760px) {
  .hero .wrap, .offer { grid-template-columns: 1fr; }
  .grid3, .lessons { grid-template-columns: 1fr; }
  .steps { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .next-card { grid-template-columns: 1fr; }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .opts { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .greet { grid-template-columns: 96px 1fr; }
  .greet .wali { width: 96px; }
  .brand small { display: none; }
}
@media (max-width: 420px) {
  .top .linkbtn { font-size: .9rem; }
  .seg button { padding: 6px 9px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.reduce * { transition: none !important; animation: none !important; }
@keyframes pop { 0% { transform: scale(.85); opacity: .4 } 100% { transform: scale(1); opacity: 1 } }
.pop { animation: pop .35s ease-out; }

.kidbtn:has(input:checked) { border-color: var(--adey); }
.kidbtn:focus-within { outline: 3px solid var(--lake); outline-offset: 2px; }
.mv .mv-frame { pointer-events: none; }
.mv .cell.tap .mv-cell { fill: transparent; }
.mv .cell.tap .mv-cell:hover { fill: var(--lake-soft); }

.brand > span { min-width: 0; }
@media (max-width: 480px) { .hide-sm { display: none; } .brand b { font-size: 1rem; } }
.mv .mv-marknum { fill: var(--ink); font-family: var(--f-display); font-weight: 800; font-size: 44px; }

/* legal pages */
.legal { padding-block: 20px 48px; display: grid; gap: 16px; max-width: 760px; }
.legal h1 { font-size: clamp(1.7rem, 5vw, 2.3rem); }
.legal-sec { display: grid; gap: 6px; }
.legal-sec h2 { font-size: 1.15rem; }
.legal-sec p { max-width: 65ch; }
.legal mark { background: var(--adey-soft); color: var(--adey-ink); border-radius: 4px; padding: 0 3px; }
.draft-note { background: var(--berry-soft); color: var(--ink); border-radius: 12px; padding: 10px 14px; }
.footer-row { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: center; justify-content: space-between; }
.footer-row > span { flex: 1 1 320px; min-width: 0; }
.footer-links { display: flex; gap: 12px; }
.linkbtn.inline { min-height: 0; padding: 0; text-decoration: underline; font-weight: 600; }
.copyable { user-select: all; }


/* Playful UI refresh: motion enhances learning but never hides math content. */
:root {
  --play-ring: 0 0 0 4px color-mix(in srgb, var(--lake) 22%, transparent);
  --play-lift: 0 14px 28px -17px rgba(29,37,64,.36);
}
.hero {
  background: radial-gradient(circle at 85% 15%, var(--adey-soft), transparent 38%),
              radial-gradient(circle at 5% 95%, var(--lake-soft), transparent 36%),
              var(--bg);
}
.hero-art .wali { transform-origin: 50% 90%; animation: wali-welcome 3.2s ease-in-out infinite; }
.hero-art .bubble { animation: bubble-arrive .6s ease-out both; }
.lcard, .opt, .kidbtn, .btn { transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease, background-color .18s ease; }
.lcard:hover, .lcard:focus-visible { transform: translateY(-4px); box-shadow: var(--play-lift); }
.btn:hover, .opt:hover { transform: translateY(-2px); box-shadow: var(--play-lift); }
.btn:active, .opt:active, .lcard:active, .kidbtn:active { transform: scale(.97); }
.opt { min-height: 80px; border-width: 3px; box-shadow: 0 4px 0 var(--line); touch-action: manipulation; }
.opt:focus-visible, .lcard:focus-visible, .btn:focus-visible, .kidbtn:focus-visible,
.mv .tap:focus-visible { outline: 4px solid var(--lake); outline-offset: 3px; }
.opt.right { animation: answer-celebrate .48s ease-out both; }
.opt.wrong { animation: answer-try-again .36s ease-out both; }
.feedback.ok .wali, .done .wali { transform-origin: 50% 90%; animation: wali-cheer .7s ease-out both; }
.done .badge { animation: badge-bloom .65s cubic-bezier(.2,1.5,.4,1) both; }

@keyframes wali-cheer { 0% { transform: scale(.92) rotate(-4deg); } 55% { transform: scale(1.08) rotate(4deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes badge-bloom { from { transform:scale(.6) rotate(-10deg); opacity:.5; } to { transform:scale(1) rotate(0); opacity:1; } }
@media (hover:none) { .lcard:hover, .opt:hover, .btn:hover { transform:none; box-shadow:none; } }
@media (prefers-reduced-motion:reduce) {
  .hero-art .wali, .hero-art .bubble, .opt.right, .opt.wrong,

}

.reduce .feedback.ok .wali, .reduce .done .wali, .reduce .done .badge { animation:none !important; }

/* Five-question arcade on the learner home */
.mini-hub { display:grid; gap:12px; margin:16px 0 24px; }
.mini-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:12px; }
.mini-tile { border:2px solid var(--line); background:var(--surface); border-radius:20px; min-height:145px; padding:16px 12px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; cursor:pointer; box-shadow:var(--shadow); }

.mini-game { display:grid; gap:16px; padding-block:22px 50px; }

.mini-top { display:flex; align-items:center; justify-content:space-between; gap:12px; }

.mini-track { height:12px; border-radius:20px; background:var(--tray); overflow:hidden; }
.mini-track span { display:block; height:100%; background:var(--field); transition:width .25s ease; }
.mini-visual { min-height:140px; display:flex; align-content:center; align-items:center; justify-content:center; flex-wrap:wrap; gap:8px; padding:16px; border-radius:18px; background:var(--lake-soft); }
.mini-objects { font-size:clamp(1.8rem,7vw,3rem); }
.mini-equation { font-size:clamp(2.5rem,10vw,4.5rem); font-family:var(--f-display); font-weight:800; }
.mini-options { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:10px; }

@media(max-width:550px) { .mini-grid { grid-template-columns:1fr; } .mini-tile { min-height:88px; flex-direction:row; text-align:left; } .mini-tile span { font-size:2rem; } .mini-options { grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media(prefers-reduced-motion:reduce) { .mini-track span,.mini-tile { transition:none; } }
.reduce .mini-track span,.reduce .mini-tile { transition:none; }

/* Phase 3: a three-stop illustrated adventure journey */
.adventure-map {display:flex; align-items:center; gap:8px; padding:16px; border-radius:24px; background:linear-gradient(145deg,var(--field-soft),var(--lake-soft) 53%,var(--adey-soft));}
.adventure-stop {flex:1; min-width:0; display:grid; gap:8px; justify-items:center; position:relative;}

.adventure-step {display:grid; place-items:center; width:30px; height:30px; border-radius:50%; font-weight:800; color:var(--surface); background:var(--lake);}

.adventure-map .mini-tile {width:100%; min-height:128px; z-index:1;}

@keyframes scene-bob {0%,100%{transform:translateY(0) rotate(-2deg)} 50%{transform:translateY(-7px) rotate(2deg)}}
@media(max-width:650px) {.adventure-map{flex-direction:column}.adventure-stop{width:100%}.adventure-map .mini-tile{min-height:82px}.adventure-trail{transform:rotate(90deg);line-height:1}}
@media(prefers-reduced-motion:reduce) {.adventure-scene,.mini-finish .wali{animation:none!important}}
.reduce .adventure-scene,.reduce .mini-finish .wali{animation:none!important}

/* ===== Hands-on lessons: player, exercises, games, map, wardrobe. Touch first: every piece is 64px+. ===== */
[hidden] { display: none !important; }
body { overflow-x: clip; }
.adv-lesson { padding-bottom: 40px; }
.adv-bar { display: flex; align-items: center; gap: 10px; padding: 12px 0; position: sticky; top: 58px; z-index: 4; background: var(--bg); }

/* intro + celebration */

.btn.big { min-height: 64px; font-size: 1.25rem; padding: 0 34px; border-radius: 32px; }
.celebrate h1 { font-size: clamp(1.6rem, 6vw, 2.3rem); position: relative; z-index: 1; line-height: 1.4; }
.celebrate h1 .en-sub, .adv-intro h1 .en-sub { font-size: 1.05rem; line-height: 1.35; margin-top: 6px; }
.confetti { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 2; }
.big-stars { font-size: 72px; line-height: 1; margin: 16px 0; color: var(--line); }

.new-badges, .unlocked { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin: 14px 0; }
.unlocked { flex-direction: column; align-items: center; background: var(--adey-soft); border-radius: var(--r); padding: 12px; }

.actions.center { justify-content: center; }

/* ===== video ===== */
.adv-video .vwrap { position: relative; border-radius: var(--r); overflow: hidden; background: #000; aspect-ratio: 16 / 9; box-shadow: var(--shadow); }
.adv-video video { width: 100%; height: 100%; display: block; }
.vplay { position: absolute; inset: 0; margin: auto; width: 88px; height: 88px; border-radius: 50%; border: 0; background: var(--adey); color: var(--ink); font-size: 2rem; box-shadow: var(--shadow); cursor: pointer; }

video::cue { font-size: 1.05rem; background: rgba(0, 0, 0, .65); }

.sheet { position: fixed; inset: 0; z-index: 80; background: rgba(17, 24, 42, .55); display: grid; place-items: center; padding: 16px; }
.sheet-in { background: var(--surface); border-radius: var(--r); padding: 16px; width: min(640px, 100%); display: grid; gap: 12px; box-shadow: var(--shadow); }

/* ===== exercise shell ===== */
.ex { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.ex-prompt { display: flex; gap: 10px; align-items: flex-start; margin-bottom: 12px; }

.ex.wobble { animation: wobble .4s; }
@keyframes wobble { 20% { transform: translateX(-6px); } 40% { transform: translateX(6px); } 60% { transform: translateX(-4px); } 80% { transform: translateX(3px); } }
.ex.is-right { outline: 4px solid var(--field); }

.vis { max-width: 100%; height: auto; }
svg.vis { width: min(100%, 300px); }

.grp { display: inline-flex; flex-wrap: wrap; max-width: 140px; gap: 2px; padding: 6px; border: 2px dashed var(--lake); border-radius: 14px; background: var(--lake-soft); }

.spark { position: fixed; width: 10px; height: 10px; border-radius: 3px; pointer-events: none; z-index: 90; animation: spark .75s ease-out forwards; }
@keyframes spark { to { transform: translate(var(--dx), var(--dy)) rotate(200deg); opacity: 0; } }
.pop { animation: popin .35s cubic-bezier(.3, 1.7, .5, 1); }
@keyframes popin { from { transform: scale(.6); } to { transform: scale(1); } }
.pulse { animation: pulse 1s ease-in-out 3; }
@keyframes pulse { 50% { transform: scale(1.12); box-shadow: 0 0 0 8px color-mix(in srgb, var(--field) 30%, transparent); } }
.shake { animation: wobble .35s; }
html.reduce .pop, html.reduce .pulse, html.reduce .ex.wobble, html.reduce .shake { animation: none; }

/* ===== drag pieces & drop zones ===== */
.drag { touch-action: none; user-select: none; -webkit-user-select: none; cursor: grab; -webkit-tap-highlight-color: transparent; }
.drag.ghost { cursor: grabbing; pointer-events: none; filter: drop-shadow(0 10px 14px rgba(0, 0, 0, .25)); }

.ph { display: inline-block; }
.zone.over { outline: 4px dashed var(--adey); outline-offset: 4px; background-color: var(--adey-soft); }

.piece { display: inline-grid; place-items: center; min-width: 64px; min-height: 64px; border-radius: 14px; }

.dd-target.bajaj .dd-in { background: #d9eef2; border-radius: 18px; min-height: 76px; padding: 4px; }
.dd-target.bajaj .wheel { position: absolute; bottom: -18px; width: 38px; height: 38px; border-radius: 50%; background: #1d2540; border: 5px solid #586178; }
.dd-target.bajaj .wheel.l { left: 34px; } .dd-target.bajaj .wheel.r { right: 34px; }
.dd-target.bajaj .dd-count { bottom: 8px; }
.dd-target.tray { background: #e7c79b; border: 4px solid #a8763c; border-radius: 50%; min-height: 110px; padding-top: 18px; }

.dd-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: 100%; max-width: 420px; }

.dd-target.tree { background: radial-gradient(circle at 50% 40%, #6fbf73 0 58%, transparent 59%), linear-gradient(#7a4a22, #7a4a22) center bottom / 26px 40% no-repeat; min-height: 240px; min-width: 280px; padding: 28px 30px 90px; }
.dd-target.tenframe .dd-in { display: grid; grid-template-columns: repeat(5, 62px); gap: 0; border: 3px solid var(--ink); border-radius: 8px; background: #fff; }

.eqn { display: flex; align-items: center; justify-content: center; gap: 8px; flex-wrap: wrap; font: 800 clamp(2rem, 9vw, 3rem)/1 var(--f-display); }

.blank { display: inline-grid; place-items: center; min-width: 84px; min-height: 84px; border: 4px dashed var(--lake); border-radius: 18px; background: var(--lake-soft); }

.bins { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; width: 100%; }
.bin { min-height: 150px; border-radius: 18px; border: 3px solid var(--line); background: var(--tray); padding: 10px; display: grid; align-content: start; gap: 8px; text-align: center; }

.cards { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
.card { display: inline-grid; place-items: center; gap: 2px; min-width: 76px; min-height: 76px; padding: 6px 10px; border-radius: 16px; background: var(--surface); border: 3px solid var(--lake); font: 800 1.35rem var(--f-display); box-shadow: 0 3px 0 var(--line); }
.card .vis { max-width: 130px; }
.card.word { font-family: var(--f-eth); font-size: 1.25rem; }
.card.geez { font-size: 2rem; }

.nl { position: relative; width: min(100%, 560px); height: 130px; margin: 6px 24px 0; }

.tick .slot:empty { background: transparent; }
.tick .slot.over { background: var(--adey-soft); }
.tick .slot .tile { position: absolute; bottom: 0; left: 50%; transform: translateX(-50%); min-width: 48px; min-height: 48px; font-size: 1.15rem; }

.pv { width: 100%; display: grid; gap: 12px; }
.pv-src { display: flex; gap: 20px; justify-content: center; align-items: center; padding: 10px; background: var(--tray); border-radius: 18px; }

.piece.rod, .piece.cube, .piece.flat { min-width: 0; min-height: 0; }

/* hundreds, tens and ones: three narrower columns */

svg.vis.wide { width: min(100%, 420px); }
@keyframes bundle { to { transform: translateX(-60px) scale(.6); opacity: 0; } }

.match-slots { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
.mslot { display: grid; justify-items: center; gap: 6px; min-width: 110px; min-height: 130px; padding: 10px; border-radius: 18px; border: 3px dashed var(--lake); background: var(--lake-soft); }

.m-in { min-height: 64px; }

.shop { display: grid; grid-template-columns: auto 1fr; gap: 12px; width: 100%; align-items: center; }
.shop-item { display: grid; justify-items: center; background: var(--adey-soft); border-radius: 18px; padding: 10px 14px; }

.counter { position: relative; min-height: 130px; border-radius: 18px; border: 3px dashed var(--field); background: var(--field-soft); padding: 10px 10px 34px; }

.cash { display: inline-grid; place-items: center; min-width: 64px; min-height: 64px; }

.frac { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; justify-content: center; }
.inj { position: relative; width: 200px; height: 200px; border-radius: 50%; }
.inj svg { position: absolute; inset: 0; }

  // move an element into a container with a little hop (used by demos and snaps)
  async function flyTo(el, container, before = null) {
    const a = el.getBoundingClientRect();
    container.insertBefore(el, before);
    const b = el.getBoundingClientRect();
    if (reduce()) return;
    el.style.transition = 'none'; el.style.transform = `translate(${a.left - b.left}px, ${a.top - b.top}px)`;
    void el.offsetWidth;
    el.style.transition = 'transform .45s cubic-bezier(.3,1.3,.5,1)'; el.style.transform = '';
    await wait(470); el.style.transition = '';

  // Drag objects into a basket / tray / ten frame, or take some off the tree.
  TYPES.drag_drop_count = (api) => {
    const { ex, body } = api, thing = ex.items.thing, remove = ex.items.mode === 'remove';
    const targets = ex.targets.map((t) => Object.assign({}, t, { count: t.start }));
    body.innerHTML = `<div class="dd-wrap ${remove ? 'remove' : ''}"></div>`;
    const wrap = body.firstElementChild;
    // optional reference tray (compare lesson): "same as / more than the left tray"
    targets.filter((t) => t.match).forEach((t) => {
      wrap.appendChild(h(`<div class="dd-ref"><div class="dd-target tray static">${Array.from({ length: t.match }, (_, i) => `<span class="piece static">${objSVG(thing, i, 46)}</span>`).join('')}</div><span class="dd-count">${t.match}</span></div>`));
    });
    // three or more trays / plates sit two to a row, so every plate and the supply fit on a phone screen
    const group = targets.filter((t) => t.kind === 'tray').length >= 3 ? wrap.appendChild(h('<div class="dd-group"></div>'))
      : targets.some((t) => t.kind === 'column') ? wrap.appendChild(h('<div class="dd-cols"></div>')) : null;
    const zones = targets.map((t) => {
      const kind = t.kind || 'basket';
      const z = h(`<div class="dd-target ${kind}" data-id="${t.id}" aria-label="${esc(kind)}" ${kind === 'grid' ? `style="--cols:${t.cols}"` : ''}>${t.label ? `<b class="dd-label">${api.T(t.label.am, t.label.en)}</b>` : ''}<div class="dd-in"></div>${kind === 'basket' ? '<div class="basket-front" aria-hidden="true"></div>' : ''}${kind === 'bajaj' ? '<i class="wheel l" aria-hidden="true"></i><i class="wheel r" aria-hidden="true"></i>' : ''}<span class="dd-count" aria-live="polite">${t.count}</span></div>`);
      const inner = z.querySelector('.dd-in');
      if (kind === 'tenframe') for (let i = 0; i < 10; i++) inner.appendChild(h(`<span class="cell" data-i="${i}"></span>`));
      if (kind === 'grid') for (let i = 0; i < t.cols * t.rows; i++) inner.appendChild(h(`<span class="cell" data-i="${i}"></span>`));
      for (let i = 0; i < t.start; i++) {
        const p = h(`<span class="piece ${remove ? '' : 'static'}">${objSVG(thing, i, kind === 'tenframe' ? 40 : kind === 'grid' ? 42 : 46)}</span>`);
        place(z, inner, p, kind);
        if (remove) dragPiece(p);
      }
      (group || wrap).appendChild(z); ACT.zone(z); z._t = t; return z;
    });
    function place(z, inner, p, kind) {
      if (kind === 'tenframe' || kind === 'grid') { const cell = [...inner.children].find((c) => !c.firstChild); if (cell) cell.appendChild(p); else inner.appendChild(p); }
      else inner.appendChild(p);
    }
    const supply = h('<div class="dd-supply zone-home"></div>');
    const basket = remove ? h('<div class="dd-target basket" data-id="down"><div class="dd-in"></div><div class="basket-front" aria-hidden="true"></div><span class="dd-count">0</span></div>') : null;
    if (remove) { wrap.appendChild(basket); ACT.zone(basket); basket._t = { count: 0 }; }
    else {
      for (let i = 0; i < ex.items.supply; i++) { const p = h(`<span class="piece">${objSVG(thing, i, 52)}</span>`); supply.appendChild(p); dragPiece(p); }
      wrap.appendChild(supply); ACT.zone(supply);
    }
    function dragPiece(p) {
      ACT.drag(p, {
        zones: () => (remove ? [basket, ...zones] : [...zones, supply]),
        drop: (z, el) => {
          const fromZone = el._in || (remove ? zones[0] : null);
          if (z === fromZone || (z === supply && !el._in)) return false;
          if (z === supply || (remove && zones.includes(z))) { // taking it back out
            if (remove) { // back up the tree from the basket
              if (el._in !== basket) return false;
              basket._t.count--; upd(basket); z._t.count++; upd(z); el._in = z; z.querySelector('.dd-in').appendChild(el); check(); return true;
            }
            if (fromZone) { fromZone._t.count--; upd(fromZone); }
            el._in = null; supply.appendChild(el); return true;
          }
          if (remove) { // to the basket
            zones[0]._t.count--; upd(zones[0]); basket._t.count++; upd(basket); el._in = basket;
            basket.querySelector('.dd-in').appendChild(el); api.progress(basket._t.count); pop(el); check(); return true;
          }
          const t = z._t;
          if (t.count >= t.need) { api.wrong(); return false; } // too many — bounce back with a hint
          if (fromZone) { fromZone._t.count--; upd(fromZone); }
          t.count++; upd(z); el._in = z; place(z, z.querySelector('.dd-in'), el, t.kind);
          api.progress(t.count); api.sayNum(t.count); pop(el); check(); return true;
        }

    }
    function upd(z) { const c = z.querySelector(':scope > .dd-count'); if (c) c.textContent = z._t.count; }
    function done() { return zones.every((z) => z._t.count === z._t.need); }
    function check() { if (done()) api.right(); }
    async function demo() {
      for (const z of zones) {
        while (z._t.count !== z._t.need) {
          if (remove) { const p = [...z.querySelectorAll('.dd-in .piece')].pop(); z._t.count--; upd(z); basket._t.count++; upd(basket); p._in = basket; await flyTo(p, basket.querySelector('.dd-in')); }
          else if (z._t.count < z._t.need) { const p = supply.querySelector('.piece'); z._t.count++; upd(z); p._in = z; await flyTo(p, z.querySelector('.dd-in')); }
          else { const p = [...z.querySelectorAll('.dd-in .piece:not(.static)')].pop(); z._t.count--; upd(z); p._in = null; await flyTo(p, supply); }
          api.progress(remove ? basket._t.count : z._t.count);
        }
      }
    }
    return { demo, solve: () => demo().then(() => api.right()) };
  };

  // things to measure on a ruler, drawn to stretch across the given width

  // Put numbers in their places on a number line.
  TYPES.drag_numberline = (api) => {
    const { ex, body } = api, { min, max, step, labels, denom, object } = ex.line;
    const n = (max - min) / step;
    // denom: values are numerators, shown as fractions (2 on a quarter line reads 2/4); 0 and 1 stay whole
    const lab = (v) => (denom ? (Number(v) === 0 ? '0' : Number(v) === denom ? '1' : `${v}/${denom}`) : String(v));
    let ticks = '';
    for (let k = 0; k <= n; k++) {
      const v = min + k * step, x = (k / n) * 100;
      const show = labels === 'all' ? true : labels === 'tens' ? v % 10 === 0 : labels === 'none' ? k === 0 : (k === 0 || k === n);
      ticks += `<span class="tick" style="left:${x}%" data-v="${v}"><i></i>${show ? `<em>${lab(v)}</em>` : ''}<span class="slot" data-v="${v}"></span></span>`;
    }
    // a ruler: the thing to measure lies along the line from 0; the child drags the flag to where it ends
    const obj = object ? `<div class="nl-obj" style="width:${((object.length - min) / (max - min)) * 100}%">${measureThing(object.thing || 'pencil')}</div>` : '';
    body.innerHTML = `<div class="nl ${object ? 'ruler' : ''} ${labels === 'all' && n > 10 ? 'dense' : ''}">${obj}<div class="nl-line"></div>${ticks}</div><div class="tiles zone-home"></div>`;

  // Build a number with (hundreds flats,) tens rods and ones cubes. Ten loose cubes bundle themselves
  // into a rod and ten rods into a flat, unless the exercise fixes how many tens / hundreds to use

  TYPES.drag_placevalue = (api) => {
    const { ex, body } = api, tg = ex.targets[0], fixT = tg.tens, fixH = tg.hundreds;
    const hasH = !!(ex.items && ex.items.flats) || ex.answer >= 100;
    const col = (k, am, en) => `<div class="pv-col ${k}"><b>${api.T(am, en)}</b><div class="pv-in"></div><span class="pv-n">0</span></div>`;
    body.innerHTML = `<div class="pv ${hasH ? 'h3' : ''}">
      <div class="pv-src">${hasH ? `<span class="src-flat" aria-label="hundred">${flat(1.15)}</span>` : ''}<span class="src-rod" aria-label="ten">${rod()}</span><span class="src-cube" aria-label="one">${cube(2)}</span></div>
      <div class="pv-mat">${hasH ? col('hundreds', 'መቶዎች', 'Hundreds') : ''}${col('tens', 'አስሮች', 'Tens')}${col('ones', 'አንዶች', 'Ones')}</div>
      <div class="pv-total" dir="ltr"><span class="t">0</span></div></div>`;
    const cols = { flat: body.querySelector('.pv-col.hundreds'), rod: body.querySelector('.pv-col.tens'), cube: body.querySelector('.pv-col.ones') };
    const ins = Object.fromEntries(Object.entries(cols).map(([k, c]) => [k, c && c.querySelector('.pv-in')]));
    const st = { flat: 0, rod: 0, cube: 0 };
    const VAL = { flat: 100, rod: 10, cube: 1 };
    Object.values(cols).forEach((c) => c && ACT.zone(c));
    const home = body.querySelector('.pv-src'); ACT.zone(home);
    const total = () => st.flat * 100 + st.rod * 10 + st.cube;
    function show() {
      for (const k in cols) if (cols[k]) cols[k].querySelector('.pv-n').textContent = st[k];
      body.querySelector('.pv-total .t').textContent = total();
    }
    const pic = (k) => (k === 'flat' ? flat(hasH ? 0.62 : 0.8) : k === 'rod' ? rod(hasH ? 0.62 : 0.9) : cube(hasH ? 1.05 : 1.4));
    function addPiece(k) {
      const p = h(`<span class="piece ${k}">${pic(k)}</span>`);
      ins[k].appendChild(p); pop(p);
      ACT.drag(p, { zones: () => [home], drop: () => { // drag back off the mat to remove
        p.remove(); st[k]--; show(); return 'keep-place';
      } });
    }
    async function bundle(from, to, line) { // ten ones → one ten; ten tens → one hundred
      const ps = [...ins[from].querySelectorAll('.piece.' + from)].slice(0, 10);
      ps.forEach((c) => c.classList.add('bundling'));
      await wait(reduce() ? 0 : 500);
      ps.forEach((c) => c.remove()); st[from] -= 10; st[to]++; addPiece(to); show();
      api.say && api.say(line);
    }
    const ONE_TEN = { am: 'አስር አንዶች አንድ አስር ይሆናሉ።', en: 'Ten ones make one ten.', audio_url: 'audio/am/lesson.g2_add2d.example.2.mp3' };
    const ONE_HUNDRED = { am: 'አስር አስሮች አንድ መቶ ይሆናሉ።', en: 'Ten tens make one hundred.', audio_url: 'audio/am/lesson.g3_hundreds.example.0.mp3' };
    function accept(k) {
      const fixed = k === 'flat' ? fixH : k === 'rod' ? fixT : null;
      if (fixed != null ? st[k] >= fixed : total() + VAL[k] > ex.answer) { api.wrong(); return false; }
      if (total() + VAL[k] > ex.answer) { api.wrong(); return false; }
      st[k]++; addPiece(k);
      show(); api.progress(Math.min(10, st[k]));
      (async () => {
        if (k === 'cube' && fixT == null && st.cube === 10) await bundle('cube', 'rod', ONE_TEN);
        if (hasH && fixH == null && st.rod === 10) await bundle('rod', 'flat', ONE_HUNDRED);
        check();

      return true;
    }
    function check() {
      if (total() !== ex.answer) return;

      if (hasH && (fixH == null ? st.rod >= 10 : st.flat !== fixH)) return;
      api.right();
    }
    const src = { flat: body.querySelector('.src-flat'), rod: body.querySelector('.src-rod'), cube: body.querySelector('.src-cube') };
    for (const k in src) if (src[k]) ACT.drag(src[k], { clone: true, zones: () => Object.values(cols).filter(Boolean), drop: (z) => (z === cols[k] ? accept(k) : (api.wrong(), false)) });
    function want() {

    }
    return { demo, solve: () => demo().then(() => api.right()) };
  };

    }

  // Fill an injera with fraction pieces. `parts` (default 4) is how many equal parts make the whole;
  // a "half" piece covers parts/2 of them, every other piece (quarter, third, sixth…) covers one.
  TYPES.drag_fraction = (api) => {
    const { ex, body } = api, P = ex.parts || 4;
    const filled = Array.from({ length: P }, () => false);
    for (let i = 0; i < (ex.targets[0].start || 0); i++) filled[i] = true;
    body.innerHTML = `<div class="frac"><div class="inj zone">${injera(1, 0, true, 200)}<svg class="inj-fill" viewBox="0 0 96 96" width="200" height="200" aria-hidden="true"></svg></div><div class="pieces zone-home"></div></div>
      <p class="frac-count" dir="ltr"><b>0</b>/${P}</p>`;
    const inj = body.querySelector('.inj'), fillSvg = body.querySelector('.inj-fill'), pieces = body.querySelector('.pieces');
    ACT.zone(inj);
    const ang = (k) => (k * 360 / P - 90) * Math.PI / 180;
    const sector = (k, n = 1, c = 48, r = 44) => `M${c} ${c} L${(c + r * Math.cos(ang(k))).toFixed(1)} ${(c + r * Math.sin(ang(k))).toFixed(1)} A${r} ${r} 0 ${n * 360 / P > 180 ? 1 : 0} 1 ${(c + r * Math.cos(ang(k + n))).toFixed(1)} ${(c + r * Math.sin(ang(k + n))).toFixed(1)} Z`;
    function draw() {
      fillSvg.innerHTML = filled.map((f, k) => (f ? `<path d="${sector(k)}" fill="#f2b705" opacity=".9"/>` : '')).join('') +
        filled.map((_, k) => `<path d="M48 48 L${(48 + 44 * Math.cos(ang(k))).toFixed(1)} ${(48 + 44 * Math.sin(ang(k))).toFixed(1)}" stroke="#1d2540" stroke-width="1.5" stroke-dasharray="3 3"/>`).join('');
      body.querySelector('.frac-count b').textContent = filled.filter(Boolean).length;
    }
    draw();
    const sizeOf = (kind) => (kind === 'half' ? P / 2 : 1);
    function pieceSVG(kind) { // the piece on its own, cropped to its shape, at the size it has on the injera
      const n = sizeOf(kind), pts = [[48, 48]];
      for (let i = 0; i <= 24; i++) { const a = ang(0) + (i / 24) * n * 2 * Math.PI / P; pts.push([48 + 44 * Math.cos(a), 48 + 44 * Math.sin(a)]); }
      const xs = pts.map((q) => q[0]), ys = pts.map((q) => q[1]);
      const x0 = Math.min(...xs) - 3, y0 = Math.min(...ys) - 3, w = Math.max(...xs) + 3 - x0, hh = Math.max(...ys) + 3 - y0;
      const k = 200 / 96; // same scale as the 200px injera
      return `<svg viewBox="${x0.toFixed(1)} ${y0.toFixed(1)} ${w.toFixed(1)} ${hh.toFixed(1)}" width="${Math.round(w * k * 0.62)}" height="${Math.round(hh * k * 0.62)}" aria-hidden="true"><path d="${sector(0, n)}" fill="#e9dcc0" stroke="#b59a6a" stroke-width="3"/><circle cx="${(48 + 26 * Math.cos(ang(0) + n * Math.PI / P)).toFixed(1)}" cy="${(48 + 26 * Math.sin(ang(0) + n * Math.PI / P)).toFixed(1)}" r="2" fill="#c9b68e"/></svg>`;
    }
    function slotFor(kind) {
      const n = sizeOf(kind);
      for (let k = 0; k < P; k++) { let ok = true; for (let j = 0; j < n; j++) if (filled[(k + j) % P]) ok = false; if (ok) return Array.from({ length: n }, (_, j) => (k + j) % P); }
      return null;
    }
    ex.items.forEach((p) => { for (let i = 0; i < p.count; i++) {
      const el = h(`<span class="fpiece ${p.piece}" data-kind="${p.piece}" aria-label="${p.piece}">${pieceSVG(p.piece)}</span>`); pieces.appendChild(el);
      ACT.drag(el, { zones: () => [inj], drop: (z, e2) => {
        const size = sizeOf(p.piece), now = filled.filter(Boolean).length, s = slotFor(p.piece);
        if (!s || now + size > ex.answer) { api.wrong(); return false; }
        s.forEach((k) => { filled[k] = true; }); e2.remove(); draw(); pop(inj); api.progress(now + size);
        if (now + size === ex.answer) api.right();
        return 'keep-place';
      } });
    } });
    async function demo() {
      let need = ex.answer - filled.filter(Boolean).length;
      for (const el of [...pieces.querySelectorAll('.fpiece')]) {
        const size = sizeOf(el.dataset.kind); if (size > need) continue;
        const s = slotFor(el.dataset.kind); if (!s) continue;
        await flyTo(el, inj); s.forEach((k) => { filled[k] = true; }); el.remove(); draw(); need -= size; if (!need) break;
      }
    }
    return { demo, solve: () => demo().then(() => api.right()) };
  };

  // ---- tap to choose (numbers, words or pictures), read aloud ----
  function options(api, opts, onPick) {

  // ---- number pad ----
  TYPES.numpad = (api) => {

    body.insertAdjacentHTML('beforeend', `<output class="np-out" dir="ltr" aria-live="polite">&nbsp;</output><div class="np">${[1, 2, 3, 4, 5, 6, 7, 8, 9, '⌫', 0, '✓'].map((k) => `<button type="button" class="np-k ${k === '✓' ? 'ok' : ''}" data-k="${k}" aria-label="${k === '⌫' ? 'Delete' : k === '✓' ? 'Check' : k}">${k}</button>`).join('')}</div>`);

  // ---- true / false swipe ----

    const { ex, body } = api;
    body.innerHTML = `<div class="tf-card" tabindex="0">${ex.visual ? visual(ex.visual) : ''}<p class="tf-s">${api.T(ex.statement_am, ex.statement_en)}</p><span class="tf-stamp"></span></div>

      if (v === ex.answer) { done = true; card.classList.add('right'); card.querySelector('.tf-stamp').textContent = v ? '✓' : '✗'; setTimeout(() => { card.style.transform = ''; }, 400); api.right(); }

    }

    body.querySelector('.tf-no').addEventListener('click', () => answer(false));

    card.addEventListener('pointerdown', (e) => { sx = e.clientX; card.setPointerCapture(e.pointerId); card.style.transition = 'none'; });
    card.addEventListener('pointermove', (e) => { if (sx === null) return; const dx = e.clientX - sx; card.style.transform = `translateX(${dx}px) rotate(${dx / 14}deg)`; card.classList.toggle('lean-yes', dx > 40); card.classList.toggle('lean-no', dx < -40); });
    card.addEventListener('pointerup', (e) => { if (sx === null) return; const dx = e.clientX - sx; sx = null; card.classList.remove('lean-yes', 'lean-no'); if (Math.abs(dx) > 80) answer(dx > 0); else { card.style.transition = 'transform .25s'; card.style.transform = ''; } });

    const demo = async () => { done = true; card.classList.add('right'); card.querySelector('.tf-stamp').textContent = ex.answer ? '✓' : '✗'; body.querySelector(ex.answer ? '.tf-yes' : '.tf-no').classList.add('pulse'); await wait(900); };
    return { demo, solve: () => answer(ex.answer) };

  // ---- clock: drag the hands ----
  TYPES.clock = (api) => {
    const { ex, body } = api;
    let nums = ''; for (let k = 1; k <= 12; k++) { const a = (k * 30 - 90) * Math.PI / 180; nums += `<text x="${(100 + 76 * Math.cos(a)).toFixed(1)}" y="${(100 + 76 * Math.sin(a) + 7).toFixed(1)}" text-anchor="middle" font-size="20" font-weight="700" fill="#1d2540" font-family="Noto Sans, sans-serif">${k}</text>`; }
    let marks = ''; for (let k = 0; k < 60; k++) { const a = k * 6 * Math.PI / 180, r1 = k % 5 ? 90 : 86; marks += `<path d="M${(100 + r1 * Math.sin(a)).toFixed(1)} ${(100 - r1 * Math.cos(a)).toFixed(1)} L${(100 + 94 * Math.sin(a)).toFixed(1)} ${(100 - 94 * Math.cos(a)).toFixed(1)}" stroke="#586178" stroke-width="${k % 5 ? 1 : 2.5}"/>`; }
    body.innerHTML = `<svg class="clock" viewBox="0 0 200 200" width="270" height="270" role="img" aria-label="clock"><circle cx="100" cy="100" r="97" fill="#fff" stroke="#1d2540" stroke-width="4"/>${marks}${nums}
      <g class="hand hour" data-h="hour"><path d="M100 100 L100 52" stroke="#1d2540" stroke-width="9" stroke-linecap="round"/><circle cx="100" cy="52" r="14" fill="transparent"/></g>
      <g class="hand minute" data-h="minute"><path d="M100 100 L100 22" stroke="#b8456e" stroke-width="6" stroke-linecap="round"/><circle cx="100" cy="24" r="16" fill="transparent"/></g>
      <circle cx="100" cy="100" r="7" fill="#1d2540"/></svg>
      <button type="button" class="btn adey ck">✓ ${api.T('እንፈትሽ', 'Check')}</button>`;
    const svg = body.querySelector('svg');
    const ang = { hour: 0, minute: 0 }; // degrees, 0 = 12 o'clock
    const setHand = (k) => body.querySelector(`.hand.${k}`).setAttribute('transform', `rotate(${ang[k]} 100 100)`);
    let active = null;
    const toAngle = (e) => { const r = svg.getBoundingClientRect(); const x = e.clientX - (r.left + r.width / 2), y = e.clientY - (r.top + r.height / 2); return (Math.atan2(x, -y) * 180 / Math.PI + 360) % 360; };
    body.querySelectorAll('.hand').forEach((g) => {
      g.style.cursor = 'grab'; g.style.touchAction = 'none';
      g.addEventListener('pointerdown', (e) => { active = g.dataset.h; g.setPointerCapture(e.pointerId); e.preventDefault(); });
      const mStep = (ex.step || 5) * 6; // degrees per minute step
      g.addEventListener('pointermove', (e) => { if (active !== g.dataset.h) return; const a = toAngle(e); ang[active] = active === 'minute' ? Math.round(a / mStep) * mStep % 360 : Math.round(a / 15) * 15 % 360; setHand(active); });
      g.addEventListener('pointerup', () => { if (active) LK.sfx && LK.sfx.tap && LK.sfx.tap(); active = null; });
    });
    // tap on the face also moves the closest-fitting hand (helps small fingers)
    let done = false;
    body.querySelector('.ck').addEventListener('click', () => {
      if (done) return;
      const m = Math.round(ang.minute / 6) % 60, hourPos = ang.hour / 30; // 0–12
      // the short hand must be on the hour, moved along towards the next hour as the minutes pass (half an hour of slack)
      const want = (ex.answer.h % 12) + ex.answer.m / 60, diff = Math.abs(((hourPos - want) % 12 + 18) % 12 - 6);
      const hOk = diff <= (ex.answer.m === 0 ? 0.25 : 0.5);
      if (m === ex.answer.m && hOk) { done = true; svg.classList.add('right'); api.right(); } else api.wrong();
    });
    const target = () => ({ minute: ex.answer.m * 6, hour: ((ex.answer.h % 12) + ex.answer.m / 60) * 30 });
    const demo = async () => { done = true; const t = target(); for (let i = 1; i <= 12; i++) { ang.minute = t.minute * i / 12; ang.hour = t.hour * i / 12; setHand('minute'); setHand('hour'); await wait(reduce() ? 0 : 50); } svg.classList.add('right'); };
    return { demo, solve: () => { const t = target(); ang.minute = t.minute; ang.hour = t.hour; setHand('minute'); setHand('hour'); body.querySelector('.ck').click(); } };
  };

  // ---- trace a number or word with a finger ----
  TYPES.trace = (api) => {
    const { ex, body } = api;
    const W = 320, H = 240;
    body.innerHTML = `<div class="trace"><canvas width="${W * 2}" height="${H * 2}" style="width:${W}px;height:${H}px" aria-label="tracing area"></canvas></div>
      <div class="trace-btns"><button type="button" class="btn ghost clr">↺ ${api.T('እንደገና', 'Again')}</button><button type="button" class="btn adey ck">✓ ${api.T('እንፈትሽ', 'Check')}</button></div>`;
    const cv = body.querySelector('canvas'), g = cv.getContext('2d');
    g.scale(2, 2);
    const font = ex.script === 'ethiopic' ? `700 120px "Noto Sans Ethiopic", sans-serif` : `800 ${ex.text.length > 1 ? 170 : 200}px "Andika", "Noto Sans", sans-serif`;
    // guide points: sample the inside of the letters
    const off = document.createElement('canvas'); off.width = W; off.height = H; const o = off.getContext('2d');
    o.font = font; o.textAlign = 'center'; o.textBaseline = 'middle'; o.fillText(ex.text, W / 2, H / 2 + 8);
    const data = o.getImageData(0, 0, W, H).data, guide = [];
    for (let y = 0; y < H; y += 7) for (let x = 0; x < W; x += 7) if (data[(y * W + x) * 4 + 3] > 128) guide.push([x, y]);
    let strokes = [], cur = null, done = false;
    function paint() {
      g.clearRect(0, 0, W, H);
      g.font = font; g.textAlign = 'center'; g.textBaseline = 'middle';
      g.fillStyle = 'rgba(31,122,140,.13)'; g.fillText(ex.text, W / 2, H / 2 + 8);
      g.setLineDash([6, 8]); g.lineWidth = 2; g.strokeStyle = 'rgba(31,122,140,.6)'; g.strokeText(ex.text, W / 2, H / 2 + 8); g.setLineDash([]);
      if (guide.length) { g.fillStyle = '#b8456e'; g.beginPath(); g.arc(guide[0][0], guide[0][1], 8, 0, 6.3); g.fill(); }
      g.lineCap = 'round'; g.lineJoin = 'round'; g.lineWidth = 16; g.strokeStyle = done ? '#2f8f5b' : '#f2b705';
      strokes.forEach((s) => { g.beginPath(); s.forEach(([x, y], i) => (i ? g.lineTo(x, y) : g.moveTo(x, y))); g.stroke(); });
    }
    paint();
    const pos = (e) => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * W / r.width, (e.clientY - r.top) * H / r.height]; };
    cv.style.touchAction = 'none';
    cv.addEventListener('pointerdown', (e) => { if (done) return; cv.setPointerCapture(e.pointerId); cur = [pos(e)]; strokes.push(cur); paint(); });
    cv.addEventListener('pointermove', (e) => { if (!cur) return; cur.push(pos(e)); paint(); });
    cv.addEventListener('pointerup', () => { cur = null; if (score().cover >= 0.62 && score().stray <= 0.4) finishTrace(); });
    function score() {
      const pts = strokes.flat(); if (!pts.length || !guide.length) return { cover: 0, stray: 1 };
      const near = (a, b, d) => (a[0] - b[0]) ** 2 + (a[1] - b[1]) ** 2 <= d * d;
      const cover = guide.filter((gp) => pts.some((p) => near(gp, p, 16))).length / guide.length;
      const stray = pts.filter((p) => !guide.some((gp) => near(gp, p, 18))).length / pts.length;
      return { cover, stray };
    }
    function finishTrace() { if (done) return; done = true; paint(); api.right(); }
    body.querySelector('.clr').addEventListener('click', () => { if (done) return; strokes = []; paint(); });
    body.querySelector('.ck').addEventListener('click', () => { const s = score(); if (s.cover >= 0.5 && s.stray <= 0.45) finishTrace(); else { api.wrong(); } });
    const demo = async () => {
      strokes = []; const pts = guide.slice().sort((a, b) => a[1] - b[1] || a[0] - b[0]);
      for (let i = 0; i < pts.length; i += 3) { strokes.push([pts[i], [pts[i][0] + 1, pts[i][1] + 1]]); if (i % 30 === 0) { paint(); await wait(reduce() ? 0 : 30); } }
      done = true; paint();
    };
    return { demo, solve: () => { strokes = [guide.slice()]; finishTrace(); } };
  };

  // Simple recordings store (IndexedDB) for the grown-ups page.
  LK.recordings = {
    _db() {
      return new Promise((res, rej) => {
        if (!G.indexedDB) { rej(new Error('no idb')); return; }
        const r = indexedDB.open('lk-recordings', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('rec', { keyPath: 'id' });
        r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
      });

  // ---- video with checkpoints, captions, replay, low-bandwidth fallback ----

  function paintVideo(stage, s, c) {

    const vid = stage.querySelector('video'), playBtn = stage.querySelector('.vplay'), layer = stage.querySelector('.cp-layer'), next = stage.querySelector('.vnext');
    const cps = v.checkpoints.filter((cp) => cp.t != null);
    let pausedAt = null, switched = low;
    vid.addEventListener('loadedmetadata', () => { [...vid.textTracks].forEach((t) => { t.mode = t.language === 'en' ? 'disabled' : 'hidden'; }); });

    if (kind === 'lesson') {
      steps.push({ k: 'story' }, { k: 'example' });
      for (let i = 0; i < 6; i++) steps.push({ k: 'item', src: 'practice' });
      for (let i = 0; i < 3; i++) steps.push({ k: 'item', src: 'game' });
      steps.push({ k: 'done' });
    } else if (kind === 'review') {
      for (let i = 0; i < 3; i++) steps.push({ k: 'item', src: 'review' });
      steps.push({ k: 'done' });
    } else {
      steps.push({ k: 'intro' });
      LK.diagnosticItems(rng).forEach((it) => steps.push({ k: 'item', src: 'diag', item: it }));
      steps.push({ k: 'done' });
    }
    S.run = { kind, skill, guest, rng, steps, i: 0, stars0: L.stars, events: [], diag: [], started: Date.now(), answered: 0, correct: 0 };

      body = `<div class="card story"><div class="stage">${A.scene('meadow', 'A meadow of yellow Adey Abeba flowers')}${A.wali('welcome', 'Wali waving')}</div>
